name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Full matrix on a schedule; PRs run the deterministic gate below.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  deterministic:
    name: deterministic gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: trust project tasks and assert pinned toolchain
        # The Rust pin lives only in mise.toml; no step repeats the version.
        run: |
          set -euo pipefail
          mise trust
          pin="$(sed -n 's/^rust = "\(.*\)"$/\1/p' mise.toml)"
          test -n "$pin"
          cargo --version | grep -F "cargo $pin"
      - name: formatting
        run: mise run fmt
      - name: compile (locked)
        run: mise run check
      - name: tests and doctests (locked)
        run: mise run test
      - name: clippy (pedantic, restrictions, selected nursery)
        run: mise run clippy
      - name: byte-clean Herdr generation
        run: mise run codegen-herdr
      - name: byte-clean Zellij generation
        run: mise run codegen-zellij
      - name: Zellij fixture verification
        run: mise run codegen-zellij-verify
      - name: completions byte-clean
        run: |
          set -euo pipefail
          env -u RUSTUP_TOOLCHAIN cargo run --locked \
            -p codegen-completions -- --check
      - name: owned no-host fixtures (activation transactions)
        # TempDir framed-control old/target fixtures from the native library.
        # Deterministic and host-free: this is NOT the real-host smoke below.
        run: |
          set -euo pipefail
          env -u RUSTUP_TOOLCHAIN cargo test --locked -p muxe \
            --lib lifecycle::activate::tests
      - name: owned no-host fixtures (recorded Herdr socket)
        # Production adapter against recorded socket fixtures, including the
        # exact pane argv/cwd exchange. Deterministic and host-free: this is
        # NOT the real-host smoke below.
        run: |
          set -euo pipefail
          env -u RUSTUP_TOOLCHAIN cargo test --locked \
            -p muxe-adapter-herdr --test recorded_socket


  full-matrix:
    name: full matrix (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: trust project tasks and assert pinned toolchain
        run: |
          set -euo pipefail
          mise trust
          pin="$(sed -n 's/^rust = "\(.*\)"$/\1/p' mise.toml)"
          test -n "$pin"
          cargo --version | grep -F "cargo $pin"
      - name: full workspace tests (locked)
        run: |
          set -euo pipefail
          env -u RUSTUP_TOOLCHAIN cargo test --workspace --locked
      - name: pinned Zellij host (source build at pin)
        # No official 0.46.0 release asset exists, so CI builds the exact
        # pinned source revision. Repository, revision, and expected version
        # all come from pins/zellij.toml; nothing here repeats them.
        run: |
          set -euo pipefail
          zrepo="$(sed -n 's/^repository = "\(.*\)"$/\1/p' pins/zellij.toml)"
          zrev="$(sed -n 's/^revision = "\(.*\)"$/\1/p' pins/zellij.toml)"
          zver="$(sed -n 's/^host_version = "\(.*\)"$/\1/p' pins/zellij.toml)"
          test -n "$zrepo"
          test -n "$zrev"
          test -n "$zver"
          zdir="$RUNNER_TEMP/zellij-host"
          mkdir -p "$zdir"
          env -u RUSTUP_TOOLCHAIN cargo install --git "$zrepo" --rev "$zrev" \
            --locked --root "$zdir" zellij
          echo "$zdir/bin" >> "$GITHUB_PATH"
          "$zdir/bin/zellij" --version | grep -F "$zver"
      - name: pinned Herdr host (0.8.2, digest-verified)
        # Official v0.8.2 release assets exist; each carries a published
        # SHA-256 digest (release id 373248423) verified here before use.
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) hasset="herdr-linux-x86_64"; hdigest="976150a14d490c94b243ea2e1a7eb2dfb67f12e36b182db90936f6728e6aecf4" ;;
            Linux-aarch64) hasset="herdr-linux-aarch64"; hdigest="f55610658e1c2e0d2aaef730b4b2ab885f7f8ba00285ab372bfb14f2e3d5b40d" ;;
            Darwin-arm64) hasset="herdr-macos-aarch64"; hdigest="a5d4f4d504d8b309c91f811050559300faba31258425f53c50852fc96f6ae574" ;;
            *) echo "no pinned Herdr asset for $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          hdir="$RUNNER_TEMP/herdr-host"
          mkdir -p "$hdir"
          curl -fSL "https://github.com/herdrdev/herdr/releases/download/v0.8.2/$hasset" -o "$hdir/herdr"
          test "$(file_digest "$hdir/herdr")" = "$hdigest" || {
            echo "Herdr release asset digest mismatch for $hasset"
            exit 1
          }
          chmod 755 "$hdir/herdr"
          echo "$hdir" >> "$GITHUB_PATH"
          "$hdir/herdr" --version | grep -F "0.8.2"

  benches:
    name: benchmarks (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: trust project tasks and assert pinned toolchain
        run: |
          set -euo pipefail
          mise trust
          pin="$(sed -n 's/^rust = "\(.*\)"$/\1/p' mise.toml)"
          test -n "$pin"
          cargo --version | grep -F "cargo $pin"
      - name: divan comparisons
        # Benchmark entrypoints are owned by their source crates; this step
        # only runs the comparisons. Non-blocking: no blanket threshold.
        run: |
          set -euo pipefail
          env -u RUSTUP_TOOLCHAIN cargo bench --locked
      - name: build benchmarks for CodSpeed (mise task)
        # Runner binary and build flags live in the mise manifest (coordinator
        # scope); this step only invokes the task, never installs ad hoc.
        run: mise run bench-codspeed
      - name: CodSpeed comparison upload
        # Published for pull requests without failing the build: no blanket
        # regression threshold. Crate-local benchmark entrypoints remain owned
        # by their source owners; this step only uploads comparisons. The run
        # command matches the runner help (`run`, not `bench`).
        uses: CodSpeedHQ/action@v3
        with:
          run: cargo codspeed run
          token: ${{ secrets.CODSPEED_TOKEN }}
  realhost-smoke:
    name: small Linux real-host smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: trust project tasks and assert pinned toolchain
        run: |
          set -euo pipefail
          mise trust
          pin="$(sed -n 's/^rust = "\(.*\)"$/\1/p' mise.toml)"
          test -n "$pin"
          cargo --version | grep -F "cargo $pin"
      - name: host capability probe
        id: capability
        run: |
          set -euo pipefail
          # Both pinned hosts must be present or this gate fails explicitly.
          # A missing capability is a failing gate, never a silent skip.
      - name: temp-scoped smoke
        # All smoke state lives under a fresh TempDir; never the default host.
        # No real-host scenario command is ready or authorized under the
        # current no-live-host scope (broker owner: owned Herdr scenario
        # awaits review; input owns the TempDir CLI pane smoke separately).
        # Until an exact retained-child/explicit-endpoint command lands, the
        # probe, version, and binary checks above are the complete gate, and
        # they fail closed. Nothing here stands in for a host interaction.
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          export SMOKE_DIR
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          env -u RUSTUP_TOOLCHAIN cargo run --locked -p muxe -- \
            compatibility --json | tee "$SMOKE_DIR/compat.json"
