name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Scheduled and manual runs also run the Linux and macOS test matrix.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  deterministic:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install development tools
        uses: jdx/mise-action@v2
        with:
          install: true
      - name: Restore Rust build cache
        uses: jdx/mr-boxington-action@v1
        with:
          # Concurrent checks use separate Cargo target directories.
          github-cache-mode: objects
      - name: Set up Rust build caching
        run: mbx setup --yes
      - name: Trust mise tasks and check Cargo version
        # Compare Cargo's version with the Rust version in mise.toml.
        run: |
          set -euo pipefail
          mise trust
          pin="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          test -n "$pin"
          mise exec -- cargo --version | grep -F "cargo $pin"
      - name: Check Rust formatting
        run: mise run fmt
      - name: Compile, test, and run Clippy in parallel
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=target/ci-check mise run check &
          check_pid=$!
          CARGO_TARGET_DIR=target/ci-tests mise run test &
          tests_pid=$!
          CARGO_TARGET_DIR=target/ci-clippy mise run clippy &
          clippy_pid=$!
          status=0
          wait "$check_pid" || status=$?
          wait "$tests_pid" || status=$?
          wait "$clippy_pid" || status=$?
          exit "$status"
      - name: Check generated Herdr API code
        run: mise run codegen-herdr
      - name: Check generated Zellij API code
        run: mise run codegen-zellij
      - name: Verify Zellij source fixtures
        run: mise run codegen-zellij-verify
      - name: Check generated shell completions
        run: |
          set -euo pipefail
          mise exec -- cargo run --locked \
            -p codegen-completions -- --check

      - name: Verify packaged WebAssembly
        # Verify the packaged checksum and compatibility build ID, then
        # confirm that modified WebAssembly bytes are rejected.
        run: mise run verify-packaged-wasm
      - name: Test activation preflight checks
        run: mise run verify-activation-preflight

  full-matrix:
    name: Rust and multiplexer tests (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install development tools
        uses: jdx/mise-action@v2
        with:
          install: true
      - name: Restore Rust build cache
        uses: jdx/mr-boxington-action@v1
        with:
          # Keep cached command outputs for the external Zellij source build.
          # Cargo target pruning would otherwise discard that installation.
          github-cache-mode: objects
      - name: Trust mise tasks and check Cargo version
        # Compare Cargo's version with the Rust version in mise.toml.
        run: |
          set -euo pipefail
          mise trust
          pin="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          test -n "$pin"
          mise exec -- cargo --version | grep -F "cargo $pin"
      - name: Require approval for live host tests
        # Stop before installing hosts unless repository-level approval is set.
        env:
          ALLOW_LIVE_HOST_MATRIX: ${{ vars.ALLOW_LIVE_HOST_MATRIX }}
        run: |
          set -euo pipefail
          test "${ALLOW_LIVE_HOST_MATRIX:-}" = "true" || {
            echo "BLOCKED: live host tests require recorded user approval." >&2
            echo "Set the ALLOW_LIVE_HOST_MATRIX repository variable to \"true\" only after approval." >&2
            exit 1
          }
      - name: Run workspace tests with Cargo.lock
        run: |
          set -euo pipefail
          mise exec -- cargo test --workspace --locked
      - name: Build and install Zellij
        # Build the repository and revision in pins/zellij.toml and check its
        # expected version. The pinned revision has no official release asset.
        run: |
          set -euo pipefail
          zrepo="$(sed -n 's/^repository = "\(.*\)"$/\1/p' pins/zellij.toml)"
          zrev="$(sed -n 's/^revision = "\(.*\)"$/\1/p' pins/zellij.toml)"
          zver="$(sed -n 's/^host_version = "\(.*\)"$/\1/p' pins/zellij.toml)"
          test -n "$zrepo"
          test -n "$zrev"
          test -n "$zver"
          zdir="$RUNNER_TEMP/zellij-host"
          mkdir -p "$zdir"
          CARGO_TARGET_DIR=target/zellij-install \
            mise exec -- mbx install --git "$zrepo" --rev "$zrev" \
              --locked --root "$zdir" zellij
          echo "$zdir/bin" >> "$GITHUB_PATH"
          "$zdir/bin/zellij" --version | grep -F "$zver"
      - name: Download and verify Herdr
        # Read the repository, version, asset name, and SHA-256 checksum from
        # pins/herdr.toml.
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          hrepo="$(sed -n 's/^repository = "\(.*\)"$/\1/p' pins/herdr.toml)"
          hver="$(sed -n 's/^host_version = "\(.*\)"$/\1/p' pins/herdr.toml)"
          test -n "$hrepo"
          test -n "$hver"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) hkey="linux_x86_64" ;;
            Linux-aarch64) hkey="linux_aarch64" ;;
            Darwin-arm64) hkey="macos_aarch64" ;;
            *) echo "no pinned Herdr asset for $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          hasset="$(sed -n "s/^release_${hkey}_asset = \"\(.*\)\"$/\1/p" pins/herdr.toml)"
          hdigest="$(sed -n "s/^release_${hkey}_sha256 = \"\(.*\)\"$/\1/p" pins/herdr.toml)"
          test -n "$hasset"
          test "${#hdigest}" -eq 64
          hdir="$RUNNER_TEMP/herdr-host"
          mkdir -p "$hdir"
          curl -fSL "$hrepo/releases/download/v$hver/$hasset" -o "$hdir/herdr"
          test "$(file_digest "$hdir/herdr")" = "$hdigest" || {
            echo "Herdr release asset digest mismatch for $hasset"
            exit 1
          }
          chmod 755 "$hdir/herdr"
          echo "$hdir" >> "$GITHUB_PATH"
          "$hdir/herdr" --version | grep -F "$hver"
      - name: Build WebAssembly bridge
        # Use the release build task and hash the resulting file below.
        run: |
          set -euo pipefail
          mise trust
          mise run wasm-build
          test -f dist-wasm/muxe-zellij.wasm
      - name: Stage complete installation
        # Embed the bridge checksum through MUXE_WASM_SHA256 in the native
        # release build. Package muxe at the installation root, with the bridge
        # under lib/muxe, shell completions, and LICENSE. The executable resolves
        # its bridge relative to its own parent; a bin/ subdirectory is invalid.
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          expected="$(file_digest dist-wasm/muxe-zellij.wasm)"
          test "${#expected}" -eq 64
          export MUXE_WASM_SHA256="$expected"
          mise exec -- cargo build --locked --release -p muxe
          bin="target/release/muxe"
          test -x "$bin"
          command -v strings >/dev/null 2>&1 || {
            echo "MISSING: strings (binutils) on this runner"
            exit 1
          }
          strings "$bin" > strings.out
          grep -Fq "$expected" strings.out || {
            echo "staging failure: native binary does not embed producer digest"
            exit 1
          }
          rm -rf "$RUNNER_TEMP/target-install"
          mkdir -p "$RUNNER_TEMP/target-install/lib/muxe" \
            "$RUNNER_TEMP/target-install/share/muxe/completions"
          cp "$bin" "$RUNNER_TEMP/target-install/muxe"
          chmod 755 "$RUNNER_TEMP/target-install/muxe"
          cp dist-wasm/muxe-zellij.wasm "$RUNNER_TEMP/target-install/lib/muxe/muxe-zellij.wasm"
          cp share/muxe/completions/muxe.bash \
            share/muxe/completions/_muxe \
            share/muxe/completions/muxe.fish \
            "$RUNNER_TEMP/target-install/share/muxe/completions/"
          cp LICENSE "$RUNNER_TEMP/target-install/LICENSE"
          test "$(file_digest "$RUNNER_TEMP/target-install/lib/muxe/muxe-zellij.wasm")" = "$expected"
          echo "Staged installation with WebAssembly SHA-256: $expected"
      - name: Test installation with Herdr and Zellij
        # target_only_smoke tests activation and two-client read-only routing
        # against the staged installation and both pinned hosts on this OS.
        # The runner owns its child processes and uses explicit endpoints,
        # foreground bootstrap, and scoped PTY clients.
        # Approval comes from ALLOW_LIVE_HOST_MATRIX above. Missing capabilities
        # or inputs fail the test. Installing hosts alone does not validate it.
        # Cross-release upgrade, rollback, and fault tests remain deferred until
        # a published predecessor is available; see TODO-CROSS-RELEASE.md.
        run: |
          set -euo pipefail
          mise exec -- cargo build --locked --manifest-path tools/muxe-zellij-foreground/Cargo.toml --bins
          fx="$PWD/tools/muxe-zellij-foreground/target/debug"
          test -x "$fx/muxe-zellij-foreground" || { echo "MISSING: built foreground binary"; exit 1; }
          test -x "$fx/muxe-zellij-bootstrap" || { echo "MISSING: built bootstrap binary"; exit 1; }
          test -x "$fx/muxe-zellij-permit" || { echo "MISSING: built permission seeder"; exit 1; }
          test -x "$fx/muxe-zellij-fault-injector" || { echo "MISSING: built fault-injector binary"; exit 1; }
          # Run isolated fixture tests before the live host test.
          mise exec -- cargo test --locked -p muxe --test live_hosts scoped_spawn
          mise exec -- cargo test --locked --manifest-path tools/muxe-zellij-foreground/Cargo.toml
          # Supply explicit inputs and the approval checked above.
          MUXE_TARGET_INSTALLATION="$RUNNER_TEMP/target-install" \
          MUXE_HERDR_BINARY="$(command -v herdr)" \
          MUXE_ZELLIJ_BINARY="$(command -v zellij)" \
          MUXE_ZELLIJ_FOREGROUND_BINARY="$fx/muxe-zellij-foreground" \
          MUXE_ZELLIJ_BOOTSTRAP_BINARY="$fx/muxe-zellij-bootstrap" \
          MUXE_ZELLIJ_PERMISSION_SEEDER="$fx/muxe-zellij-permit" \
          MUXE_LIVE_HOSTS_APPROVED=true \
          mise exec -- cargo test --locked -p muxe --test live_hosts -- --ignored --exact target_only_smoke --show-output

  benches:
    name: Benchmarks
    # Pushes to main publish the CodSpeed baseline that pull requests compare against.
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OpenID Connect authentication with CodSpeed; no upload token secret is needed.
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install development tools
        uses: jdx/mise-action@v2
        with:
          install: true
      - name: Restore Rust build cache
        uses: jdx/mr-boxington-action@v1
      - name: Trust mise tasks and check Cargo version
        # Compare Cargo's version with the Rust version in mise.toml.
        run: |
          set -euo pipefail
          mise trust
          pin="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          test -n "$pin"
          mise exec -- cargo --version | grep -F "cargo $pin"
      - name: Build WebAssembly for release-profile benchmarks
        run: |
          set -euo pipefail
          mise trust
          mise run wasm-build
          test -f dist-wasm/muxe-zellij.wasm
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum dist-wasm/muxe-zellij.wasm | cut -d' ' -f1)"
          elif command -v shasum >/dev/null 2>&1; then
            digest="$(shasum -a 256 dist-wasm/muxe-zellij.wasm | cut -d' ' -f1)"
          else
            echo "MISSING: no sha256sum or shasum on this runner" >&2
            exit 1
          fi
          test "${#digest}" -eq 64
          echo "MUXE_WASM_SHA256=$digest" >> "$GITHUB_ENV"
      - name: Run Divan benchmarks
        # Run the benchmarks defined by workspace crates without a regression
        # threshold. Benchmark failures still fail this job.
        run: |
          set -euo pipefail
          mise exec -- cargo bench --locked
      - name: Build CodSpeed benchmarks
        # The mise task defines the runner version and build flags.
        run: mise run bench-codspeed
      - name: Run CodSpeed benchmarks and upload results
        # Allow failure of this entire measurement and reporting step, including
        # setup and benchmark execution. The preceding builds and cargo bench
        # still must pass.
        continue-on-error: true
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          # Run through the task to activate its pinned cargo-codspeed tool.
          run: mise run bench-codspeed run
  realhost-smoke:
    name: Herdr and Zellij tests (Linux)
    # Run only with recorded approval. A skipped job does not validate hosts.
    if: vars.ALLOW_LIVE_HOST_MATRIX == 'true'
    runs-on: ubuntu-latest
    env:
      MUXE_LIVE_HOSTS_APPROVED: ${{ vars.ALLOW_LIVE_HOST_MATRIX }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install development tools
        uses: jdx/mise-action@v2
        with:
          install: true
      - name: Restore Rust build cache
        uses: jdx/mr-boxington-action@v1
        with:
          # Share the external source install with release host preparation.
          github-cache-mode: objects
      - name: Trust mise tasks and check Cargo version
        # Compare Cargo's version with the Rust version in mise.toml.
        run: |
          set -euo pipefail
          mise trust
          pin="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          test -n "$pin"
          mise exec -- cargo --version | grep -F "cargo $pin"
      - name: Build and install Zellij
        # Build the revision in pins/zellij.toml; it has no official release asset.
        run: |
          set -euo pipefail
          zrepo="$(sed -n 's/^repository = "\(.*\)"$/\1/p' pins/zellij.toml)"
          zrev="$(sed -n 's/^revision = "\(.*\)"$/\1/p' pins/zellij.toml)"
          zver="$(sed -n 's/^host_version = "\(.*\)"$/\1/p' pins/zellij.toml)"
          test -n "$zrepo"
          test -n "$zrev"
          test -n "$zver"
          zdir="$RUNNER_TEMP/zellij-host"
          mkdir -p "$zdir"
          CARGO_TARGET_DIR=target/zellij-install \
            mise exec -- mbx install --git "$zrepo" --rev "$zrev" \
              --locked --root "$zdir" zellij
          echo "$zdir/bin" >> "$GITHUB_PATH"
          "$zdir/bin/zellij" --version | grep -F "$zver"
      - name: Download and verify Herdr
        # Use the Linux x86_64 asset and SHA-256 checksum from pins/herdr.toml.
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          hrepo="$(sed -n 's/^repository = "\(.*\)"$/\1/p' pins/herdr.toml)"
          hver="$(sed -n 's/^host_version = "\(.*\)"$/\1/p' pins/herdr.toml)"
          hasset="$(sed -n 's/^release_linux_x86_64_asset = "\(.*\)"$/\1/p' pins/herdr.toml)"
          hdigest="$(sed -n 's/^release_linux_x86_64_sha256 = "\(.*\)"$/\1/p' pins/herdr.toml)"
          test -n "$hrepo"
          test -n "$hver"
          test -n "$hasset"
          test "${#hdigest}" -eq 64
          hdir="$RUNNER_TEMP/herdr-host"
          mkdir -p "$hdir"
          curl -fSL "$hrepo/releases/download/v$hver/$hasset" -o "$hdir/herdr"
          test "$(file_digest "$hdir/herdr")" = "$hdigest" || {
            echo "Herdr release asset digest mismatch for $hasset"
            exit 1
          }
          chmod 755 "$hdir/herdr"
          echo "$hdir" >> "$GITHUB_PATH"
          "$hdir/herdr" --version | grep -F "$hver"
      - name: Check host commands and Herdr schema access
        # Missing hosts or unsupported commands fail this step.
        run: |
          set -euo pipefail
          command -v zellij >/dev/null 2>&1 || { echo "MISSING: pinned zellij not on PATH"; exit 1; }
          command -v herdr >/dev/null 2>&1 || { echo "MISSING: pinned herdr not on PATH"; exit 1; }
          zellij --version
          herdr --version
          herdr api schema --json > /dev/null
      - name: Build WebAssembly bridge
        # Use the release build task and hash the resulting file below.
        run: |
          mise run wasm-build
          test -f dist-wasm/muxe-zellij.wasm
      - name: Stage complete installation
        # Embed the bridge checksum through MUXE_WASM_SHA256 in the native
        # release build. Package muxe at the installation root, with the bridge
        # under lib/muxe, shell completions, and LICENSE. The executable resolves
        # its bridge relative to its own parent; a bin/ subdirectory is invalid.
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          expected="$(file_digest dist-wasm/muxe-zellij.wasm)"
          test "${#expected}" -eq 64
          export MUXE_WASM_SHA256="$expected"
          mise exec -- cargo build --locked --release -p muxe
          bin="target/release/muxe"
          test -x "$bin"
          command -v strings >/dev/null 2>&1 || {
            echo "MISSING: strings (binutils) on this runner"
            exit 1
          }
          strings "$bin" > strings.out
          grep -Fq "$expected" strings.out || {
            echo "staging failure: native binary does not embed producer digest"
            exit 1
          }
          rm -rf "$RUNNER_TEMP/target-install"
          mkdir -p "$RUNNER_TEMP/target-install/lib/muxe" \
            "$RUNNER_TEMP/target-install/share/muxe/completions"
          cp "$bin" "$RUNNER_TEMP/target-install/muxe"
          chmod 755 "$RUNNER_TEMP/target-install/muxe"
          cp dist-wasm/muxe-zellij.wasm "$RUNNER_TEMP/target-install/lib/muxe/muxe-zellij.wasm"
          cp share/muxe/completions/muxe.bash \
            share/muxe/completions/_muxe \
            share/muxe/completions/muxe.fish \
            "$RUNNER_TEMP/target-install/share/muxe/completions/"
          cp LICENSE "$RUNNER_TEMP/target-install/LICENSE"
          test "$(file_digest "$RUNNER_TEMP/target-install/lib/muxe/muxe-zellij.wasm")" = "$expected"
          echo "Staged installation with WebAssembly SHA-256: $expected"
      - name: Test installation with Herdr and Zellij
        # target_only_smoke tests activation and two-client read-only routing
        # against the staged installation and both pinned hosts.
        # The runner owns its child processes and uses explicit endpoints,
        # foreground bootstrap, and scoped PTY clients. The job environment
        # supplies approval; missing capabilities or inputs fail the test.
        # This tests one installation, not an upgrade from a previous release.
        run: |
          set -euo pipefail
          mise exec -- cargo build --locked --manifest-path tools/muxe-zellij-foreground/Cargo.toml --bins
          fx="$PWD/tools/muxe-zellij-foreground/target/debug"
          test -x "$fx/muxe-zellij-foreground" || { echo "MISSING: built foreground binary"; exit 1; }
          test -x "$fx/muxe-zellij-bootstrap" || { echo "MISSING: built bootstrap binary"; exit 1; }
          test -x "$fx/muxe-zellij-permit" || { echo "MISSING: built permission seeder"; exit 1; }
          test -x "$fx/muxe-zellij-fault-injector" || { echo "MISSING: built fault-injector binary"; exit 1; }
          # Run isolated fixture tests before the live host test.
          mise exec -- cargo test --locked -p muxe --test live_hosts scoped_spawn
          mise exec -- cargo test --locked --manifest-path tools/muxe-zellij-foreground/Cargo.toml
          # Supply explicit inputs and the approval from this job's environment.
          MUXE_TARGET_INSTALLATION="$RUNNER_TEMP/target-install" \
          MUXE_HERDR_BINARY="$(command -v herdr)" \
          MUXE_ZELLIJ_BINARY="$(command -v zellij)" \
          MUXE_ZELLIJ_FOREGROUND_BINARY="$fx/muxe-zellij-foreground" \
          MUXE_ZELLIJ_BOOTSTRAP_BINARY="$fx/muxe-zellij-bootstrap" \
          MUXE_ZELLIJ_PERMISSION_SEEDER="$fx/muxe-zellij-permit" \
          mise exec -- cargo test --locked -p muxe --test live_hosts -- --ignored --exact target_only_smoke --show-output
