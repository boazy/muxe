name: Release

# Distribute complete installations through GitHub Releases. Tags use
# `v{major}.{minor}.{patch}`. Each target archive contains:
#   muxe
#   lib/muxe/muxe-zellij.wasm
#   share/muxe/completions/ (muxe.bash, _muxe, muxe.fish)
#   LICENSE
#
# Build WebAssembly, check completions, and prepare host tools in parallel.
# Then build native archives, verify them, and test them with real hosts before
# publication. All prerequisite jobs must pass.
# Cross-release upgrade, rollback, and fault tests remain deferred until the
# implementation is complete and a published predecessor is available;
# see TODO-CROSS-RELEASE.md.
#
# The WebAssembly build records its file's SHA-256 checksum and the shared
# bridge build ID generated by that build. Native builds embed both values.
# Before publication, compare each native compatibility report's checksum and
# build ID with the WebAssembly build's recorded values.
#
# Linux archives use musl for static distribution. Reject binaries with an ELF
# interpreter or dynamic dependencies. Check readelf output rather than file's
# "statically linked" label so valid static-PIE binaries are accepted.
#
# Use the github context for the repository name, including when run in a fork.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Manual runs always execute validation only; publish is push-tag guarded below.
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Check release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check package version and release tag
        id: package
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ { s/^version = "\(.*\)"$/\1/p; }' Cargo.toml)"
          test "${version}" != ""
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_TYPE" = tag
            test "$GITHUB_REF_NAME" = "v$version"
          elif [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "unsupported release event: $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  shared-checks:
    name: Check shell completions
    needs: [metadata]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install development tools
        uses: jdx/mise-action@v2
        with:
          install: true
      - name: Restore Rust build cache
        uses: jdx/mr-boxington-action@v1
      - name: Check generated shell completions
        run: |
          set -euo pipefail
          mise trust
          mise exec -- cargo run --locked \
            -p codegen-completions -- --check

  wasm:
    name: Build WebAssembly bridge
    needs: [metadata]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install development tools
        uses: jdx/mise-action@v2
        with:
          install: true
      - name: Restore Rust build cache
        uses: jdx/mr-boxington-action@v1
      - name: Check Cargo version
        # Compare Cargo's version with the Rust version in mise.toml.
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          test -n "$pin"
          mise exec -- cargo --version | grep -F "cargo $pin"
      - name: Build WebAssembly in release mode
        # Remove cached protocol build-script output so this build emits exactly
        # one bridge build ID file for the tagged source.
        run: |
          set -euo pipefail
          rm -rf target/wasm32-wasip1/release/build/muxe-zellij-protocol-*
          mise trust
          mise run wasm-build
      - name: Record bridge build ID
        # Read the ID emitted by the shared protocol build used by WebAssembly.
        run: |
          set -euo pipefail
          id_files=(target/wasm32-wasip1/release/build/muxe-zellij-protocol-*/out/bridge_build_id.rs)
          test "${#id_files[@]}" -eq 1
          bridge_build_id="$(sed -n 's/^pub const BRIDGE_BUILD_ID_HEX: &str = "\([0-9a-f]\{64\}\)";$/\1/p' "${id_files[0]}")"
          test "${#bridge_build_id}" -eq 64
          test "$bridge_build_id" != "$(printf '%064d' 0)"
          printf '%s\n' "$bridge_build_id" > dist-wasm/muxe-zellij.build-id
      - name: Generate and verify WebAssembly checksum
        # Record the basename so consumers verify it in their staging directory.
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          manifest_check() {
            if command -v sha256sum >/dev/null 2>&1; then (cd "$2" && sha256sum -c "$1");
            elif command -v shasum >/dev/null 2>&1; then (cd "$2" && shasum -a 256 -c "$1");
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          test -f dist-wasm/muxe-zellij.wasm
          file dist-wasm/muxe-zellij.wasm | tee wasm-file.out
          grep -Fi "WebAssembly" wasm-file.out
          (cd dist-wasm && printf '%s  %s\n' "$(file_digest muxe-zellij.wasm)" muxe-zellij.wasm > muxe-zellij.sha256)
          manifest_check muxe-zellij.sha256 dist-wasm
      - name: Upload WebAssembly and verification files
        uses: actions/upload-artifact@v4
        with:
          name: bridge-wasm
          path: dist-wasm/

  assets:
    name: Build archive (${{ matrix.asset }})
    needs: [wasm, metadata]
    strategy:
      fail-fast: true
      matrix:
        include:
          - asset: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            uname_arch: x86_64
            file_arch: x86-64
            static: true
          - asset: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            uname_arch: aarch64
            file_arch: aarch64
            static: true
          - asset: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            uname_arch: arm64
            file_arch: arm64
            static: false
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install development tools
        uses: jdx/mise-action@v2
        with:
          install: true
      - name: Restore Rust build cache
        uses: jdx/mr-boxington-action@v1
      - name: Check Cargo version
        # Compare Cargo's version with the Rust version in mise.toml.
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          test -n "$pin"
          mise exec -- cargo --version | grep -F "cargo $pin"
      - name: Check runner architecture
        # Check the compiled binary's architecture separately below.
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.uname_arch }}"
      - name: Download WebAssembly and verification files
        uses: actions/download-artifact@v4
        with:
          name: bridge-wasm
          path: bridge-stage/
      - name: Verify WebAssembly checksum and build ID format
        run: |
          set -euo pipefail
          manifest_check() {
            if command -v sha256sum >/dev/null 2>&1; then (cd "$2" && sha256sum -c "$1");
            elif command -v shasum >/dev/null 2>&1; then (cd "$2" && shasum -a 256 -c "$1");
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          test -f bridge-stage/muxe-zellij.wasm
          test -f bridge-stage/muxe-zellij.sha256
          test -f bridge-stage/muxe-zellij.build-id
          bridge_build_id="$(cat bridge-stage/muxe-zellij.build-id)"
          test "${#bridge_build_id}" -eq 64
          case "$bridge_build_id" in
            ""|*[!0-9a-f]*) echo "release failure: malformed bridge build ID"; exit 1 ;;
          esac
          test "$bridge_build_id" != "$(printf '%064d' 0)"
          echo "BRIDGE_BUILD_ID=$bridge_build_id" >> "$GITHUB_ENV"
          file bridge-stage/muxe-zellij.wasm | tee bridge-file.out
          grep -Fi "WebAssembly" bridge-file.out
          manifest_check muxe-zellij.sha256 bridge-stage
          echo "WASM_PATH=bridge-stage/muxe-zellij.wasm" >> "$GITHUB_ENV"
      - name: Set WebAssembly checksum for native build
        # crates/muxe/build.rs embeds MUXE_WASM_SHA256 in the compatibility
        # record and requires it for release builds. Every archive packages
        # the same verified WebAssembly file.
        run: |
          set -euo pipefail
          expected="$(cut -d' ' -f1 bridge-stage/muxe-zellij.sha256)"
          test "${#expected}" -eq 64 || { echo "release failure: malformed WebAssembly checksum"; exit 1; }
          case "$expected" in
            *[!0-9a-f]*) echo "release failure: WebAssembly checksum is not lowercase hex"; exit 1 ;;
          esac
          echo "MUXE_WASM_SHA256=$expected" >> "$GITHUB_ENV"
      - name: Install musl toolchain
        if: matrix.static
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Install Rust compilation target
        run: |
          set -euo pipefail
          mise exec -- rustup target add "${{ matrix.target }}"
      - name: Build native executable
        run: |
          set -euo pipefail
          mise exec -- cargo build --locked --release \
            -p muxe --target "${{ matrix.target }}"
      - name: Verify static linkage
        if: matrix.static
        run: |
          set -euo pipefail
          command -v readelf >/dev/null 2>&1 || {
            echo "MISSING: readelf (binutils) on this runner"
            exit 1
          }
          bin="target/${{ matrix.target }}/release/muxe"
          # Capture readelf output before matching it. Piping to grep -q can
          # terminate readelf with SIGPIPE before it reports success.
          if ! headers="$(readelf -lW "$bin")"; then
            echo "release failure: readelf cannot parse $bin"
            exit 1
          fi
          case "$headers" in
            *INTERP*)
              echo "release failure: $bin carries an ELF interpreter"
              exit 1
              ;;
          esac
          if ! dynamic="$(readelf -dW "$bin" 2>/dev/null)"; then
            # A static binary may have no dynamic section. Header parsing
            # succeeded above; reject any NEEDED entry below.
            dynamic=""
          fi
          case "$dynamic" in
            *NEEDED*)
              echo "release failure: $bin carries dynamic dependencies"
              exit 1
              ;;
          esac
      - name: Check executable architecture and version
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/muxe"
          file "$bin" | tee bin-file.out
          grep -F "${{ matrix.file_arch }}" bin-file.out
          version="$RELEASE_VERSION"
          test "$("$bin" --version | cut -d' ' -f2)" = "$version"
          echo "BIN=$bin" >> "$GITHUB_ENV"
      - name: Generate native compatibility report
        run: |
          set -euo pipefail
          report="native-compat-${{ matrix.asset }}.json"
          "$BIN" compatibility --json > "$report"
          test -s "$report"
      - name: Assemble installation archive
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          root="muxe-v${version}-${{ matrix.asset }}"
          rm -rf "$root" "${root}.tar.gz"
          mkdir -p "$root/lib/muxe" "$root/share/muxe/completions" \
            "$root/share/muxe/theme-palettes"
          cp "$BIN" "$root/muxe"
          chmod 755 "$root/muxe"
          cp "$WASM_PATH" "$root/lib/muxe/muxe-zellij.wasm"
          cp share/muxe/completions/muxe.bash \
            share/muxe/completions/_muxe \
            share/muxe/completions/muxe.fish \
            "$root/share/muxe/completions/"
          cp LICENSE "$root/LICENSE"
          cp crates/muxe-core/assets/LICENSES.txt crates/muxe-core/assets/catalog.json \
            "$root/share/muxe/theme-palettes/"
          tar -czf "${root}.tar.gz" "$root"
          echo "ARCHIVE=${root}.tar.gz" >> "$GITHUB_ENV"
      - name: Upload archive and compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}
            native-compat-${{ matrix.asset }}.json

  verify:
    name: Verify release archives
    needs: [assets, metadata]
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check that all three archives are present
        run: |
          set -euo pipefail
          archives=(dist/muxe-v*.tar.gz)
          test "${#archives[@]}" -eq 3
          printf '%s\n' "${archives[@]}"
      - name: Generate and verify archive checksums
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          manifest_check() {
            if command -v sha256sum >/dev/null 2>&1; then (cd "$2" && sha256sum -c "$1");
            elif command -v shasum >/dev/null 2>&1; then (cd "$2" && shasum -a 256 -c "$1");
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          rm -f dist/SHA256SUMS
          for archive in dist/muxe-v*.tar.gz; do
            printf '%s  %s\n' "$(file_digest "$archive")" "$(basename "$archive")" >> dist/SHA256SUMS
          done
          manifest_check SHA256SUMS dist
          cp dist/SHA256SUMS .
      - name: Download WebAssembly verification files
        # Compare packaged files with the checksum from the WebAssembly build.
        uses: actions/download-artifact@v4
        with:
          name: bridge-wasm
          path: producer/
      - name: Verify installation layout and WebAssembly checksums
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          rm -rf verify-tmp
          mkdir verify-tmp
          test -f producer/muxe-zellij.sha256
          expected="$(cut -d' ' -f1 producer/muxe-zellij.sha256)"
          test -n "$expected"
          first_digest=""
          for archive in dist/muxe-v*.tar.gz; do
            name="$(basename "$archive" .tar.gz)"
            tar -xzf "$archive" -C verify-tmp
            test -x "verify-tmp/$name/muxe"
            test -f "verify-tmp/$name/lib/muxe/muxe-zellij.wasm"
            test -f "verify-tmp/$name/share/muxe/completions/muxe.bash"
            test -f "verify-tmp/$name/share/muxe/completions/_muxe"
            test -f "verify-tmp/$name/share/muxe/completions/muxe.fish"
            test -f "verify-tmp/$name/LICENSE"
            cmp crates/muxe-core/assets/LICENSES.txt "verify-tmp/$name/share/muxe/theme-palettes/LICENSES.txt"
            cmp crates/muxe-core/assets/catalog.json "verify-tmp/$name/share/muxe/theme-palettes/catalog.json"
            digest="$(file_digest "verify-tmp/$name/lib/muxe/muxe-zellij.wasm")"
            if [ -z "$first_digest" ]; then
              first_digest="$digest"
            elif [ "$digest" != "$first_digest" ]; then
              echo "release failure: WASM bytes differ in $name"
              exit 1
            fi
          done
          test "$first_digest" = "$expected" || {
            echo "release failure: archive WebAssembly checksum $first_digest"
            echo "does not match the build's recorded checksum $expected"
            exit 1
          }
      - name: Compare native compatibility reports with WebAssembly build
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || {
            echo "MISSING: jq on this runner"
            exit 1
          }
          test -f producer/muxe-zellij.build-id
          bridge_build_id="$(cat producer/muxe-zellij.build-id)"
          test "${#bridge_build_id}" -eq 64
          test "$bridge_build_id" != "$(printf '%064d' 0)"
          expected_sha="$(cut -d' ' -f1 producer/muxe-zellij.sha256)"
          reports=(dist/native-compat-*.json)
          test "${#reports[@]}" -eq 3
          for report in "${reports[@]}"; do
            report_id="$(jq -r '.hosts.zellij.bridge_build_id' "$report")"
            test "$report_id" = "$bridge_build_id" || {
              echo "release failure: $report reports bridge ID $report_id, expected $bridge_build_id"
              exit 1
            }
            test "$(jq -r '.packaged_wasm.sha256' "$report")" = "$expected_sha"
            test "$(jq -r '.packaged_wasm.unavailable_reason' "$report")" = "null"
          done
      - name: Test Linux x64 executable compatibility
        # Check the shared bridge build ID and packaged checksum independently.
        # This does not verify which bytes a running Zellij host has loaded.
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || {
            echo "MISSING: jq on this runner"
            exit 1
          }
          # Read the checksum again: shell variables do not persist across steps.
          test -f producer/muxe-zellij.sha256
          expected="$(cut -d' ' -f1 producer/muxe-zellij.sha256)"
          test -n "$expected"
          version="$RELEASE_VERSION"
          bin="verify-tmp/muxe-v${version}-linux-x64/muxe"
          test -x "$bin"
          report="$("$bin" compatibility --json)"
          test "$(jq -r '.muxe_version' <<< "$report")" = "$version"
          test "$(jq -r '.packaged_wasm.sha256' <<< "$report")" = "$expected"
          test "$(jq -r '.packaged_wasm.unavailable_reason' <<< "$report")" = "null"
          bridge_build_id="$(jq -r '.hosts.zellij.bridge_build_id' <<< "$report")"
          test -f producer/muxe-zellij.build-id
          expected_bridge_build_id="$(cat producer/muxe-zellij.build-id)"
          test "$bridge_build_id" = "$expected_bridge_build_id"
          test "${#bridge_build_id}" -eq 64
          case "$bridge_build_id" in
            ""|null|*[!0-9a-f]*) echo "invalid bridge build ID: $bridge_build_id"; exit 1 ;;
          esac
          test "$bridge_build_id" != "$(printf '%064d' 0)"
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/muxe-v*.tar.gz, SHA256SUMS"
      - name: Upload release verification files
        uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: |
            SHA256SUMS
            WASM_SHA256

  hosts:
    name: Prepare Herdr and Zellij (${{ matrix.asset }})
    strategy:
      fail-fast: true
      matrix:
        # Verify each platform's asset checksum against pins/herdr.toml.
        # Matrix expansion cannot read that file, so define the rows here.
        include:
          - asset: linux-x64
            os: ubuntu-24.04
            herdr_asset: herdr-linux-x86_64
            herdr_digest: 976150a14d490c94b243ea2e1a7eb2dfb67f12e36b182db90936f6728e6aecf4
          - asset: linux-arm64
            os: ubuntu-24.04-arm
            herdr_asset: herdr-linux-aarch64
            herdr_digest: f55610658e1c2e0d2aaef730b4b2ab885f7f8ba00285ab372bfb14f2e3d5b40d
          - asset: macos-arm64
            os: macos-15
            herdr_asset: herdr-macos-aarch64
            herdr_digest: a5d4f4d504d8b309c91f811050559300faba31258425f53c50852fc96f6ae574
    runs-on: ${{ matrix.os }}
    env:
      ALLOW_LIVE_HOST_MATRIX: ${{ vars.ALLOW_LIVE_HOST_MATRIX }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Require approval for live host tests
        run: |
          set -euo pipefail
          test "${ALLOW_LIVE_HOST_MATRIX:-}" = "true" || {
            echo "BLOCKED: live host tests require recorded user approval." >&2
            echo "Set the ALLOW_LIVE_HOST_MATRIX repository variable to \"true\" only after approval." >&2
            exit 1
          }
      - name: Install development tools
        uses: jdx/mise-action@v2
        with:
          install: true
      - name: Restore Rust build cache
        uses: jdx/mr-boxington-action@v1
        with:
          # Default target pruning excludes the external Zellij package.
          github-cache-mode: objects
      - name: Check Cargo version
        # Compare Cargo's version with the Rust version in mise.toml.
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          test -n "$pin"
          mise exec -- cargo --version | grep -F "cargo $pin"
      - name: Build and install Zellij
        run: |
          set -euo pipefail
          zrepo="$(sed -n 's/^repository = "\(.*\)"$/\1/p' pins/zellij.toml)"
          zrev="$(sed -n 's/^revision = "\(.*\)"$/\1/p' pins/zellij.toml)"
          zver="$(sed -n 's/^host_version = "\(.*\)"$/\1/p' pins/zellij.toml)"
          test -n "$zrepo"
          test -n "$zrev"
          test -n "$zver"
          zdir="$RUNNER_TEMP/zellij-host"
          mkdir -p "$zdir"
          CARGO_TARGET_DIR=target/zellij-install \
            mise exec -- mbx install --git "$zrepo" --rev "$zrev" \
              --locked --root "$zdir" zellij
          "$zdir/bin/zellij" --version | grep -F "$zver"
          echo "ZELLIJ_BINARY=$zdir/bin/zellij" >> "$GITHUB_ENV"
      - name: Download and verify Herdr
        # Read the repository and version from pins/herdr.toml and verify each
        # matrix checksum against its release_*_sha256 entry.
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          hasset="${{ matrix.herdr_asset }}"
          hdigest="${{ matrix.herdr_digest }}"
          hrepo="$(sed -n 's/^repository = "\(.*\)"$/\1/p' pins/herdr.toml)"
          hver="$(sed -n 's/^host_version = "\(.*\)"$/\1/p' pins/herdr.toml)"
          test -n "$hasset"
          test "${#hdigest}" -eq 64
          test -n "$hrepo"
          test -n "$hver"
          case "$hasset" in
            herdr-linux-x86_64) hkey="linux_x86_64" ;;
            herdr-linux-aarch64) hkey="linux_aarch64" ;;
            herdr-macos-aarch64) hkey="macos_aarch64" ;;
            *) echo "no pinned Herdr digest key for $hasset"; exit 1 ;;
          esac
          pin_digest="$(sed -n "s/^release_${hkey}_sha256 = \"\(.*\)\"$/\1/p" pins/herdr.toml)"
          test "$hdigest" = "$pin_digest" || {
            echo "Herdr checksum for $hasset does not match pins/herdr.toml"
            exit 1
          }
          hdir="$RUNNER_TEMP/herdr-host"
          mkdir -p "$hdir"
          curl -fSL "$hrepo/releases/download/v$hver/$hasset" -o "$hdir/herdr"
          test "$(file_digest "$hdir/herdr")" = "$hdigest" || {
            echo "Herdr release asset digest mismatch for $hasset"
            exit 1
          }
          chmod 755 "$hdir/herdr"
          if [ "$(uname)" = "Darwin" ] \
            && xattr -p com.apple.quarantine "$hdir/herdr" >/dev/null 2>&1; then
            xattr -d com.apple.quarantine "$hdir/herdr" || {
              echo "release failure: cannot clear macOS quarantine on $hdir/herdr"
              exit 1
            }
          fi
          "$hdir/herdr" --version | grep -F "$hver"
          echo "HERDR_BINARY=$hdir/herdr" >> "$GITHUB_ENV"
      - name: Package host executables
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-hosts"
          rm -rf "$root"
          mkdir -p "$root/bin"
          cp "$ZELLIJ_BINARY" "$root/bin/zellij"
          cp "$HERDR_BINARY" "$root/bin/herdr"
          chmod 755 "$root/bin/zellij" "$root/bin/herdr"
          archive="release-hosts-${{ matrix.asset }}.tar.gz"
          tar -czf "$archive" -C "$root" .
          echo "HOST_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Upload host executables
        uses: actions/upload-artifact@v4
        with:
          name: release-hosts-${{ matrix.asset }}
          path: ${{ env.HOST_ARCHIVE }}
  target-smoke:
    name: Test release with Herdr and Zellij (${{ matrix.asset }})
    needs: [assets, hosts, metadata]
    strategy:
      fail-fast: true
      matrix:
        include:
          - asset: linux-x64
            os: ubuntu-24.04
          - asset: linux-arm64
            os: ubuntu-24.04-arm
          - asset: macos-arm64
            os: macos-15
    env:
      ALLOW_LIVE_HOST_MATRIX: ${{ vars.ALLOW_LIVE_HOST_MATRIX }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Require approval for live host tests
        # Approval covers testing this release with hosts, not cross-release
        # upgrades. Those remain deferred in TODO-CROSS-RELEASE.md.
        run: |
          set -euo pipefail
          test "${ALLOW_LIVE_HOST_MATRIX:-}" = "true" || {
            echo "BLOCKED: live host tests require recorded user approval." >&2
            echo "Set the ALLOW_LIVE_HOST_MATRIX repository variable to \"true\" only after approval." >&2
            exit 1
          }
      - name: Install development tools
        uses: jdx/mise-action@v2
        with:
          install: true
      - name: Restore Rust build cache
        uses: jdx/mr-boxington-action@v1
      - name: Check Cargo version
        # Compare Cargo's version with the Rust version in mise.toml.
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          test -n "$pin"
          mise exec -- cargo --version | grep -F "cargo $pin"
      - name: Download host executables
        uses: actions/download-artifact@v4
        with:
          name: release-hosts-${{ matrix.asset }}
          path: host-stage
      - name: Extract host executables and set paths
        run: |
          set -euo pipefail
          archive="host-stage/release-hosts-${{ matrix.asset }}.tar.gz"
          test -f "$archive" || { echo "MISSING: prepared host archive $archive"; exit 1; }
          root="$RUNNER_TEMP/release-hosts"
          rm -rf "$root"
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"
          test -x "$root/bin/zellij" || { echo "MISSING: prepared Zellij"; exit 1; }
          test -x "$root/bin/herdr" || { echo "MISSING: prepared Herdr"; exit 1; }
          {
            echo "MUXE_ZELLIJ_BINARY=$root/bin/zellij"
            echo "MUXE_HERDR_BINARY=$root/bin/herdr"
          } >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: muxe-v${{ needs.metadata.outputs.version }}-${{ matrix.asset }}.tar.gz
          path: target-dist
      - name: Extract and check installation
        # Test the complete archive from this workflow without a predecessor.
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          archive="target-dist/muxe-v${version}-${{ matrix.asset }}.tar.gz"
          test -f "$archive" || {
            echo "MISSING: current target archive $archive"
            exit 1
          }
          rm -rf "$RUNNER_TEMP/target-install"
          mkdir -p "$RUNNER_TEMP/target-install"
          tar -xzf "$archive" -C "$RUNNER_TEMP/target-install"
          root="$RUNNER_TEMP/target-install/muxe-v${version}-${{ matrix.asset }}"
          test -x "$root/muxe" || { echo "MISSING: target executable"; exit 1; }
          test -f "$root/lib/muxe/muxe-zellij.wasm" || {
            echo "MISSING: target bridge WASM"
            exit 1
          }
          test ! -e "$root/bin/muxe" || {
            echo "INVALID: target archive uses a bin-nested executable"
            exit 1
          }
          test "$("$root/muxe" --version | cut -d' ' -f2)" = "$version" || {
            echo "target binary version mismatch"
            exit 1
          }
          echo "MUXE_TARGET_INSTALLATION=$root" >> "$GITHUB_ENV"
      - name: Build host test helpers and set paths
        run: |
          set -euo pipefail
          mise exec -- cargo build --locked --manifest-path tools/muxe-zellij-foreground/Cargo.toml --bins
          fx="$PWD/tools/muxe-zellij-foreground/target/debug"
          test -x "$fx/muxe-zellij-foreground" || { echo "MISSING: built foreground binary"; exit 1; }
          test -x "$fx/muxe-zellij-bootstrap" || { echo "MISSING: built bootstrap binary"; exit 1; }
          test -x "$fx/muxe-zellij-permit" || { echo "MISSING: built permission seeder"; exit 1; }
          test -x "$fx/muxe-zellij-fault-injector" || { echo "MISSING: built fault-injector binary"; exit 1; }
          {
            echo "MUXE_ZELLIJ_FOREGROUND_BINARY=$fx/muxe-zellij-foreground"
            echo "MUXE_ZELLIJ_BOOTSTRAP_BINARY=$fx/muxe-zellij-bootstrap"
            echo "MUXE_ZELLIJ_PERMISSION_SEEDER=$fx/muxe-zellij-permit"
          } >> "$GITHUB_ENV"
      - name: Test release installation with Herdr and Zellij
        # Test only the release archive. Require every input and live host
        # approval; missing capabilities fail the test.
        run: |
          set -euo pipefail
          MUXE_TARGET_INSTALLATION="$MUXE_TARGET_INSTALLATION" \
          MUXE_HERDR_BINARY="$MUXE_HERDR_BINARY" \
          MUXE_ZELLIJ_BINARY="$MUXE_ZELLIJ_BINARY" \
          MUXE_ZELLIJ_FOREGROUND_BINARY="$MUXE_ZELLIJ_FOREGROUND_BINARY" \
          MUXE_ZELLIJ_BOOTSTRAP_BINARY="$MUXE_ZELLIJ_BOOTSTRAP_BINARY" \
          MUXE_ZELLIJ_PERMISSION_SEEDER="$MUXE_ZELLIJ_PERMISSION_SEEDER" \
          MUXE_LIVE_HOSTS_APPROVED=true \
          mise exec -- cargo test --locked -p muxe --test live_hosts -- --ignored --exact target_only_smoke
  publish:
    name: Publish GitHub release
    needs: [verify, target-smoke, shared-checks, metadata]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && needs.verify.result == 'success' && needs.target-smoke.result == 'success' && needs.shared-checks.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify archive checksums before publication
        run: |
          set -euo pipefail
          manifest_check() {
            if command -v sha256sum >/dev/null 2>&1; then (cd "$2" && sha256sum -c "$1");
            elif command -v shasum >/dev/null 2>&1; then (cd "$2" && shasum -a 256 -c "$1");
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          archives=(dist/muxe-v*.tar.gz)
          test "${#archives[@]}" -eq 3
          test -f dist/SHA256SUMS
          manifest_check SHA256SUMS dist
      - name: Publish archives and checksums
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/muxe-v*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
