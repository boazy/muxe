name: release

# V1 is distributed through GitHub Releases. Release tags use
# `v{major}.{minor}.{patch}`. Every target archive is a complete installation:
#   muxe
#   lib/muxe/muxe-zellij.wasm
#   share/muxe/completions/ (muxe.bash, _muxe, muxe.fish)
#   LICENSE
#
# Gate order is load-bearing: wasm producer -> per-arch assets -> verify
# (checksums, byte-identity, layout, attestations) -> live gates ->
# publish. Nothing becomes public before every required gate passes.
# In particular there is no first-release waiver: with no predecessor
# artifact the live upgrade gate fails naming the missing predecessor.
#
# Toolchain rule: the Rust pin lives only in mise.toml. Workflows install it
# with jdx/mise-action and assert `cargo --version` against
# `mise current rust`; no workflow repeats the version literal, and no
# rust-toolchain action is used. Every `run` block sets pipefail so a
# failing producer can never hide behind a pipe.
#
# Linux archives target musl for static distribution. If either Linux
# architecture cannot pass the static-linkage gate below, the release is
# blocked and the target decision is reopened: a differently linked
# artifact must never be silently published under the same name. The gate
# checks for the absence of an interpreter and dynamic dependencies
# directly instead of grepping `file` output for "statically linked",
# which rejects valid static-PIE binaries.
#
# Owner/repository names are taken from the github context, never hardcoded,
# so the workflow cannot silently target a fork.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm:
    name: wasm bridge producer (single source of bytes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: pinned toolchain assert (single source is mise.toml)
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^rust = "\(.*\)"$/\1/p' mise.toml)"
          test -n "$pin"
          cargo --version | grep -F "cargo $pin"
      - name: wasm target
        run: |
          set -euo pipefail
          env -u RUSTUP_TOOLCHAIN rustup target add \
            --toolchain "$(mise current rust)" wasm32-wasip1
      - name: build bridge (release)
        # The task definition (flags, profile, stage path) is owned by the
        # mise coordinator; this job only asserts its output.
        run: |
          set -euo pipefail
          mise trust
          mise run wasm-build
      - name: stage digest
        # The manifest names the bare basename so every consumer checks it
          # inside one known directory, never by searching the workspace.
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          manifest_check() {
            if command -v sha256sum >/dev/null 2>&1; then (cd "$2" && sha256sum -c "$1");
            elif command -v shasum >/dev/null 2>&1; then (cd "$2" && shasum -a 256 -c "$1");
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          test -f dist-wasm/muxe-zellij.wasm
          file dist-wasm/muxe-zellij.wasm | tee wasm-file.out
          grep -Fi "WebAssembly" wasm-file.out
          (cd dist-wasm && printf '%s  %s\n' "$(file_digest muxe-zellij.wasm)" muxe-zellij.wasm > muxe-zellij.sha256)
          manifest_check muxe-zellij.sha256 dist-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-wasm
          path: dist-wasm/

  assets:
    name: build ${{ matrix.asset }}
    needs: [wasm]
    strategy:
      fail-fast: true
      matrix:
        include:
          - asset: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            uname_arch: x86_64
            file_arch: x86-64
            static: true
          - asset: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            uname_arch: aarch64
            file_arch: aarch64
            static: true
          - asset: macos-x64
            os: macos-15
            target: x86_64-apple-darwin
            uname_arch: arm64
            file_arch: x86_64
            static: false
          - asset: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            uname_arch: arm64
            file_arch: arm64
            static: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: pinned toolchain assert (single source is mise.toml)
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^rust = "\(.*\)"$/\1/p' mise.toml)"
          test -n "$pin"
          cargo --version | grep -F "cargo $pin"
      - name: runner architecture assert
        # macOS x64 is cross-compiled from the arm64 runner; the binary-arch
        # assert below covers the artifact. The runner itself must still be
        # the pinned image, never an implicit latest.
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.uname_arch }}"
      - name: producer bytes (exact bridge identity)
        uses: actions/download-artifact@v4
        with:
          name: bridge-wasm
          path: bridge-stage/
      - name: verify producer bytes before packaging
        run: |
          set -euo pipefail
          manifest_check() {
            if command -v sha256sum >/dev/null 2>&1; then (cd "$2" && sha256sum -c "$1");
            elif command -v shasum >/dev/null 2>&1; then (cd "$2" && shasum -a 256 -c "$1");
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          test -f bridge-stage/muxe-zellij.wasm
          test -f bridge-stage/muxe-zellij.sha256
          file bridge-stage/muxe-zellij.wasm | tee bridge-file.out
          grep -Fi "WebAssembly" bridge-file.out
          manifest_check muxe-zellij.sha256 bridge-stage
          echo "WASM_PATH=bridge-stage/muxe-zellij.wasm" >> "$GITHUB_ENV"
      - name: musl toolchain (linux only)
        if: matrix.static
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: rust target
        run: |
          set -euo pipefail
          env -u RUSTUP_TOOLCHAIN rustup target add \
            --toolchain "$(mise current rust)" "${{ matrix.target }}"
      - name: build native binary
        run: |
          set -euo pipefail
          env -u RUSTUP_TOOLCHAIN cargo build --locked --release \
            -p muxe --target "${{ matrix.target }}"
      - name: verify static linkage (linux musl only)
        if: matrix.static
        run: |
          set -euo pipefail
          command -v readelf >/dev/null 2>&1 || {
            echo "MISSING: readelf (binutils) on this runner"
            exit 1
          }
          bin="target/${{ matrix.target }}/release/muxe"
          # A dynamically linked binary under a musl asset name is a release
          # failure, never a silent mislabel. Capture first, then match: a
          # live `readelf | grep -q` pipe lets SIGPIPE report the producer's
          # death instead of the match, so no pipe carries the decision here.
          if ! headers="$(readelf -lW "$bin")"; then
            echo "release failure: readelf cannot parse $bin"
            exit 1
          fi
          case "$headers" in
            *INTERP*)
              echo "release failure: $bin carries an ELF interpreter"
              exit 1
              ;;
          esac
          if ! dynamic="$(readelf -dW "$bin" 2>/dev/null)"; then
            # A static binary has no dynamic section; parseability was proven
            # above, so only a NEEDED entry below can still fail the gate.
            dynamic=""
          fi
          case "$dynamic" in
            *NEEDED*)
              echo "release failure: $bin carries dynamic dependencies"
              exit 1
              ;;
          esac
      - name: binary architecture and version assert
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/muxe"
          file "$bin" | tee bin-file.out
          grep -F "${{ matrix.file_arch }}" bin-file.out
          version="${GITHUB_REF_NAME#v}"
          test "$("$bin" --version | cut -d' ' -f2)" = "$version"
          echo "BIN=$bin" >> "$GITHUB_ENV"
      - name: completions byte-clean
        run: |
          set -euo pipefail
          env -u RUSTUP_TOOLCHAIN cargo run --locked \
            -p codegen-completions -- --check
      - name: assemble archive
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="muxe-v${version}-${{ matrix.asset }}"
          rm -rf "$root" "${root}.tar.gz"
          mkdir -p "$root/lib/muxe" "$root/share/muxe/completions"
          cp "$BIN" "$root/muxe"
          chmod 755 "$root/muxe"
          cp "$WASM_PATH" "$root/lib/muxe/muxe-zellij.wasm"
          cp share/muxe/completions/muxe.bash \
            share/muxe/completions/_muxe \
            share/muxe/completions/muxe.fish \
            "$root/share/muxe/completions/"
          cp LICENSE "$root/LICENSE"
          tar -czf "${root}.tar.gz" "$root"
          echo "ARCHIVE=${root}.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}

  verify:
    name: checksums, identity, layout, attestations (pre-publish)
    needs: [assets]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: all four archives present
        run: |
          set -euo pipefail
          archives=(dist/muxe-v*.tar.gz)
          test "${#archives[@]}" -eq 4
          printf '%s\n' "${archives[@]}"
      - name: checksums (missing checksum fails the release)
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          manifest_check() {
            if command -v sha256sum >/dev/null 2>&1; then (cd "$2" && sha256sum -c "$1");
            elif command -v shasum >/dev/null 2>&1; then (cd "$2" && shasum -a 256 -c "$1");
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          rm -f dist/SHA256SUMS
          for archive in dist/muxe-v*.tar.gz; do
            printf '%s  %s\n' "$(file_digest "$archive")" "$(basename "$archive")" >> dist/SHA256SUMS
          done
          manifest_check SHA256SUMS dist
          cp dist/SHA256SUMS .
      - name: producer digest coupling
        # The identical-bytes check below is not self-referential: the digest
        # must also equal the single producer job's recorded digest.
        uses: actions/download-artifact@v4
        with:
          name: bridge-wasm
          path: producer/
      - name: layout and identical WASM bytes
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          rm -rf verify-tmp
          mkdir verify-tmp
          test -f producer/muxe-zellij.sha256
          expected="$(cut -d' ' -f1 producer/muxe-zellij.sha256)"
          test -n "$expected"
          first_digest=""
          for archive in dist/muxe-v*.tar.gz; do
            name="$(basename "$archive" .tar.gz)"
            tar -xzf "$archive" -C verify-tmp
            test -x "verify-tmp/$name/muxe"
            test -f "verify-tmp/$name/lib/muxe/muxe-zellij.wasm"
            test -f "verify-tmp/$name/share/muxe/completions/muxe.bash"
            test -f "verify-tmp/$name/share/muxe/completions/_muxe"
            test -f "verify-tmp/$name/share/muxe/completions/muxe.fish"
            test -f "verify-tmp/$name/LICENSE"
            digest="$(file_digest "verify-tmp/$name/lib/muxe/muxe-zellij.wasm")"
            if [ -z "$first_digest" ]; then
              first_digest="$digest"
            elif [ "$digest" != "$first_digest" ]; then
              echo "release failure: WASM bytes differ in $name"
              exit 1
            fi
          done
          test "$first_digest" = "$expected" || {
            echo "release failure: archive WASM digest $first_digest"
            echo "does not match producer digest $expected"
            exit 1
          }
          echo "$first_digest" > WASM_SHA256
          echo "WASM bytes identical in all archives and match producer: $first_digest"
      - name: runnable native smoke (linux-x64 on its own arch)
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bin="verify-tmp/muxe-v${version}-linux-x64/muxe"
          test -x "$bin"
          report="$("$bin" compatibility --json)"
          test "$(printf '%s' "$report" | grep -o '"muxe_version":"[^"]*"' | cut -d'"' -f4)" = "$version"
      - name: attest archives (before any publication)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/muxe-v*.tar.gz, SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: |
            SHA256SUMS
            WASM_SHA256

  live-matrix:
    name: fixture matrix (${{ matrix.os }})
    needs: [verify]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: pinned toolchain assert (single source is mise.toml)
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^rust = "\(.*\)"$/\1/p' mise.toml)"
          test -n "$pin"
          cargo --version | grep -F "cargo $pin"
      - name: activation old/target fixtures (no live host)
        # Owned TempDir framed-control transaction fixtures; any missing
        # runner fails here by name instead of passing silently.
        run: |
          set -euo pipefail
          env -u RUSTUP_TOOLCHAIN cargo test --locked -p muxe \
            --lib lifecycle::activate::tests
      - name: Herdr recorded-socket smoke (no live host)
        # Production adapter against recorded socket fixtures, including the
        # exact pane argv/cwd exchange.
        run: |
          set -euo pipefail
          env -u RUSTUP_TOOLCHAIN cargo test --locked \
            -p muxe-adapter-herdr --test recorded_socket

  live-upgrade:
    name: predecessor upgrade/rollback gate
    needs: [verify, live-matrix]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: predecessor check (no waiver)
        id: predecessor
        run: |
          set -euo pipefail
          prev="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
            --json tagName \
            --jq '[.[].tagName] | map(select(. != env.GITHUB_REF_NAME)) | sort | last // empty')"
          if [ -z "$prev" ]; then
            echo "BLOCKED: no predecessor release exists for $GITHUB_REF_NAME." \
              "The previous-to-target live upgrade/rollback matrix cannot run" \
              "on a first release and is a failing gate, not a waiver." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "PREVIOUS=$prev" >> "$GITHUB_ENV"
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: live-host approval opt-in (before costly installs)
        # The isolated Zellij probe permissions and the bridge-digest design
        # decision are user approvals, not CI autodetects. The gate fails
        # closed naming them until the release owner records approval by
        # setting this repository variable to "true".
        run: |
          set -euo pipefail
          test "${ALLOW_LIVE_HOST_MATRIX:-}" = "true" || {
            echo "BLOCKED: live-host upgrade requires recorded user approval" \
              "of the isolated Zellij probe permissions and the bridge" \
              "embedded-report design decision (DESIGN 2074). Set the" \
              "ALLOW_LIVE_HOST_MATRIX repository variable to \"true\" only" \
              "after those approvals exist."
            exit 1
          }
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: pinned Zellij host (source build at pin)
        # Mirrors the scheduled host matrix: no official 0.46.0 release
        # asset exists, so build the exact pinned source revision. Pin
        # values come from pins/zellij.toml, never from this file.
        run: |
          set -euo pipefail
          zrepo="$(sed -n 's/^repository = "\(.*\)"$/\1/p' pins/zellij.toml)"
          zrev="$(sed -n 's/^revision = "\(.*\)"$/\1/p' pins/zellij.toml)"
          zver="$(sed -n 's/^host_version = "\(.*\)"$/\1/p' pins/zellij.toml)"
          test -n "$zrepo"
          test -n "$zrev"
          test -n "$zver"
          zdir="$RUNNER_TEMP/zellij-host"
          mkdir -p "$zdir"
          env -u RUSTUP_TOOLCHAIN cargo install --git "$zrepo" --rev "$zrev" \
            --locked --root "$zdir" zellij
          echo "$zdir/bin" >> "$GITHUB_PATH"
          "$zdir/bin/zellij" --version | grep -F "$zver"
      - name: pinned Herdr host (0.8.2, digest-verified)
        # Official v0.8.2 assets with published SHA-256 digests
        # (release id 373248423), verified here before use.
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          hasset="herdr-linux-x86_64"
          hdigest="976150a14d490c94b243ea2e1a7eb2dfb67f12e36b182db90936f6728e6aecf4"
          hdir="$RUNNER_TEMP/herdr-host"
          mkdir -p "$hdir"
          curl -fSL "https://github.com/herdrdev/herdr/releases/download/v0.8.2/$hasset" -o "$hdir/herdr"
          test "$(file_digest "$hdir/herdr")" = "$hdigest" || {
            echo "Herdr release asset digest mismatch for $hasset"
            exit 1
          }
          chmod 755 "$hdir/herdr"
          echo "$hdir" >> "$GITHUB_PATH"
          "$hdir/herdr" --version | grep -F "0.8.2"
      - name: target archives for the driver
        uses: actions/download-artifact@v4
        with:
          path: target-dist
          merge-multiple: true
      - name: upgrade and rollback driver
        # tools/release/live-upgrade.sh stages both stacks from real archives
        # and hands them to the broker-owned session scenario. Until that
        # scenario command exists the driver fails closed naming it; the
        # predecessor, host, and approval checks above are all real.
        run: |
          set -euo pipefail
          test -n "${PREVIOUS:-}" || { echo "BLOCKED: no predecessor recorded"; exit 1; }
          bash tools/release/live-upgrade.sh "$PREVIOUS" "$GITHUB_REF_NAME" target-dist upgrade-work
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish:
    name: publish release (all gates green)
    needs: [verify, live-matrix, live-upgrade]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: pre-publish checksum gate (fail on anything missing)
        run: |
          set -euo pipefail
          manifest_check() {
            if command -v sha256sum >/dev/null 2>&1; then (cd "$2" && sha256sum -c "$1");
            elif command -v shasum >/dev/null 2>&1; then (cd "$2" && shasum -a 256 -c "$1");
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          archives=(dist/muxe-v*.tar.gz)
          test "${#archives[@]}" -eq 4
          test -f dist/SHA256SUMS
          manifest_check SHA256SUMS dist
      - name: create release (archives plus checksums, attestations already made)
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/muxe-v*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
