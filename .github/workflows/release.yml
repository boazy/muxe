name: release

# V1 is distributed through GitHub Releases. Release tags use
# `v{major}.{minor}.{patch}`. Every target archive is a complete installation:
#   muxe
#   lib/muxe/muxe-zellij.wasm
#   share/muxe/completions/ (muxe.bash, _muxe, muxe.fish)
#   LICENSE
#
# Gate order is load-bearing: WASM, shared checks, and host-tool producers run
# in parallel, then per-arch assets build; archive verification and target live
# smokes run in parallel before publication. Nothing becomes public before
# every gate passes. The cross-release upgrade/rollback/fault matrix is
# deferred until the implementation is complete and a genuine predecessor
# release is available; see TODO-CROSS-RELEASE.md.
#
# Producer identity flow (no sidecar trust, no hardcoded values): the wasm job
# records both the SHA-256 of the bytes it built and the generated shared
# bridge-build-ID witness from that exact producer build. Each asset job
# re-verifies the bytes, exports both identities, and runs its native
# compatibility CLI. Verify aggregates all three reports and requires every
# native bridge ID to equal the single WASM build witness; byte SHA checks
# remain a separate assertion.
#
# Linux archives target musl for static distribution. If either Linux
# architecture cannot pass the static-linkage gate below, the release is
# blocked and the target decision is reopened: a differently linked
# artifact must never be silently published under the same name. The gate
# checks for the absence of an interpreter and dynamic dependencies
# directly instead of grepping `file` output for "statically linked",
# which rejects valid static-PIE binaries.
#
# Owner/repository names are taken from the github context, never hardcoded,
# so the workflow cannot silently target a fork.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Manual runs always execute validation only; publish is push-tag guarded below.
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: checked package metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: resolve package version from workspace Cargo.toml
        id: package
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ { s/^version = "\(.*\)"$/\1/p; }' Cargo.toml)"
          test "${version}" != ""
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_TYPE" = tag
            test "$GITHUB_REF_NAME" = "v$version"
          elif [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "unsupported release event: $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  shared-checks:
    name: shared release checks
    needs: [metadata]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - uses: jdx/mr-boxington-action@v1
      - name: completions byte-clean
        run: |
          set -euo pipefail
          mise trust
          mise exec -- cargo run --locked \
            -p codegen-completions -- --check

  wasm:
    name: wasm bridge producer (single source of bytes)
    needs: [metadata]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - uses: jdx/mr-boxington-action@v1
      - name: pinned toolchain assert (single source is mise.toml)
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          test -n "$pin"
          mise exec -- cargo --version | grep -F "cargo $pin"
      - name: build bridge (release)
        # Objects-mode caches may restore prior build-script hash directories.
        # Remove only this generated witness producer before rebuilding so the
        # next step has exactly one output from the tagged source.
        run: |
          set -euo pipefail
          rm -rf target/wasm32-wasip1/release/build/muxe-zellij-protocol-*
          mise trust
          mise run wasm-build
      - name: stage bridge build identity witness
        # This witness is emitted from the exact shared-protocol build used by
        # the producer WASM, not inferred from native archives or WASM bytes.
        run: |
          set -euo pipefail
          id_files=(target/wasm32-wasip1/release/build/muxe-zellij-protocol-*/out/bridge_build_id.rs)
          test "${#id_files[@]}" -eq 1
          bridge_build_id="$(sed -n 's/^pub const BRIDGE_BUILD_ID_HEX: &str = "\([0-9a-f]\{64\}\)";$/\1/p' "${id_files[0]}")"
          test "${#bridge_build_id}" -eq 64
          test "$bridge_build_id" != "$(printf '%064d' 0)"
          printf '%s\n' "$bridge_build_id" > dist-wasm/muxe-zellij.build-id
      - name: stage digest
        # The manifest names the bare basename so every consumer checks it
          # inside one known directory, never by searching the workspace.
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          manifest_check() {
            if command -v sha256sum >/dev/null 2>&1; then (cd "$2" && sha256sum -c "$1");
            elif command -v shasum >/dev/null 2>&1; then (cd "$2" && shasum -a 256 -c "$1");
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          test -f dist-wasm/muxe-zellij.wasm
          file dist-wasm/muxe-zellij.wasm | tee wasm-file.out
          grep -Fi "WebAssembly" wasm-file.out
          (cd dist-wasm && printf '%s  %s\n' "$(file_digest muxe-zellij.wasm)" muxe-zellij.wasm > muxe-zellij.sha256)
          manifest_check muxe-zellij.sha256 dist-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-wasm
          path: dist-wasm/

  assets:
    name: build ${{ matrix.asset }}
    needs: [wasm, metadata]
    strategy:
      fail-fast: true
      matrix:
        include:
          - asset: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            uname_arch: x86_64
            file_arch: x86-64
            static: true
          - asset: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            uname_arch: aarch64
            file_arch: aarch64
            static: true
          - asset: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            uname_arch: arm64
            file_arch: arm64
            static: false
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - uses: jdx/mr-boxington-action@v1
      - name: pinned toolchain assert (single source is mise.toml)
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          test -n "$pin"
          mise exec -- cargo --version | grep -F "cargo $pin"
      - name: runner architecture assert
        # Each macOS asset builds on its native runner architecture; the
        # binary-arch assert below is an independent artifact check.
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.uname_arch }}"
      - name: producer bytes (exact bridge identity)
        uses: actions/download-artifact@v4
        with:
          name: bridge-wasm
          path: bridge-stage/
      - name: verify producer bytes before packaging
        run: |
          set -euo pipefail
          manifest_check() {
            if command -v sha256sum >/dev/null 2>&1; then (cd "$2" && sha256sum -c "$1");
            elif command -v shasum >/dev/null 2>&1; then (cd "$2" && shasum -a 256 -c "$1");
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          test -f bridge-stage/muxe-zellij.wasm
          test -f bridge-stage/muxe-zellij.sha256
          test -f bridge-stage/muxe-zellij.build-id
          bridge_build_id="$(cat bridge-stage/muxe-zellij.build-id)"
          test "${#bridge_build_id}" -eq 64
          case "$bridge_build_id" in
            ""|*[!0-9a-f]*) echo "release failure: malformed bridge build ID witness"; exit 1 ;;
          esac
          test "$bridge_build_id" != "$(printf '%064d' 0)"
          echo "BRIDGE_BUILD_ID=$bridge_build_id" >> "$GITHUB_ENV"
          file bridge-stage/muxe-zellij.wasm | tee bridge-file.out
          grep -Fi "WebAssembly" bridge-file.out
          manifest_check muxe-zellij.sha256 bridge-stage
          echo "WASM_PATH=bridge-stage/muxe-zellij.wasm" >> "$GITHUB_ENV"
      - name: producer digest to build env
        # The digest below comes from the verified producer manifest, never
        # from a repo sidecar: it is the SHA-256 of the staged bytes checked
        # two steps above. The native build (core-owned build.rs) consumes
        # MUXE_WASM_SHA256 and bakes it into the compatibility record; release
        # builds fail closed without it. All three archives embed the same
        # producer bytes.
        run: |
          set -euo pipefail
          expected="$(cut -d' ' -f1 bridge-stage/muxe-zellij.sha256)"
          test "${#expected}" -eq 64 || { echo "release failure: malformed producer digest"; exit 1; }
          case "$expected" in
            *[!0-9a-f]*) echo "release failure: producer digest is not lowercase hex"; exit 1 ;;
          esac
          echo "MUXE_WASM_SHA256=$expected" >> "$GITHUB_ENV"
      - name: musl toolchain (linux only)
        if: matrix.static
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: rust target
        run: |
          set -euo pipefail
          mise exec -- rustup target add "${{ matrix.target }}"
      - name: build native binary
        run: |
          set -euo pipefail
          mise exec -- cargo build --locked --release \
            -p muxe --target "${{ matrix.target }}"
      - name: verify static linkage (linux musl only)
        if: matrix.static
        run: |
          set -euo pipefail
          command -v readelf >/dev/null 2>&1 || {
            echo "MISSING: readelf (binutils) on this runner"
            exit 1
          }
          bin="target/${{ matrix.target }}/release/muxe"
          # A dynamically linked binary under a musl asset name is a release
          # failure, never a silent mislabel. Capture first, then match: a
          # live `readelf | grep -q` pipe lets SIGPIPE report the producer's
          # death instead of the match, so no pipe carries the decision here.
          if ! headers="$(readelf -lW "$bin")"; then
            echo "release failure: readelf cannot parse $bin"
            exit 1
          fi
          case "$headers" in
            *INTERP*)
              echo "release failure: $bin carries an ELF interpreter"
              exit 1
              ;;
          esac
          if ! dynamic="$(readelf -dW "$bin" 2>/dev/null)"; then
            # A static binary has no dynamic section; parseability was proven
            # above, so only a NEEDED entry below can still fail the gate.
            dynamic=""
          fi
          case "$dynamic" in
            *NEEDED*)
              echo "release failure: $bin carries dynamic dependencies"
              exit 1
              ;;
          esac
      - name: binary architecture and version assert
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/muxe"
          file "$bin" | tee bin-file.out
          grep -F "${{ matrix.file_arch }}" bin-file.out
          version="$RELEASE_VERSION"
          test "$("$bin" --version | cut -d' ' -f2)" = "$version"
          echo "BIN=$bin" >> "$GITHUB_ENV"
      - name: native compatibility report (same runner)
        run: |
          set -euo pipefail
          report="native-compat-${{ matrix.asset }}.json"
          "$BIN" compatibility --json > "$report"
          test -s "$report"
      - name: assemble archive
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          root="muxe-v${version}-${{ matrix.asset }}"
          rm -rf "$root" "${root}.tar.gz"
          mkdir -p "$root/lib/muxe" "$root/share/muxe/completions"
          cp "$BIN" "$root/muxe"
          chmod 755 "$root/muxe"
          cp "$WASM_PATH" "$root/lib/muxe/muxe-zellij.wasm"
          cp share/muxe/completions/muxe.bash \
            share/muxe/completions/_muxe \
            share/muxe/completions/muxe.fish \
            "$root/share/muxe/completions/"
          cp LICENSE "$root/LICENSE"
          tar -czf "${root}.tar.gz" "$root"
          echo "ARCHIVE=${root}.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}
            native-compat-${{ matrix.asset }}.json

  verify:
    name: checksums, identity, layout, attestations (pre-publish)
    needs: [assets, metadata]
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: all three archives present
        run: |
          set -euo pipefail
          archives=(dist/muxe-v*.tar.gz)
          test "${#archives[@]}" -eq 3
          printf '%s\n' "${archives[@]}"
      - name: checksums (missing checksum fails the release)
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          manifest_check() {
            if command -v sha256sum >/dev/null 2>&1; then (cd "$2" && sha256sum -c "$1");
            elif command -v shasum >/dev/null 2>&1; then (cd "$2" && shasum -a 256 -c "$1");
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          rm -f dist/SHA256SUMS
          for archive in dist/muxe-v*.tar.gz; do
            printf '%s  %s\n' "$(file_digest "$archive")" "$(basename "$archive")" >> dist/SHA256SUMS
          done
          manifest_check SHA256SUMS dist
          cp dist/SHA256SUMS .
      - name: producer digest coupling
        # The identical-bytes check below is not self-referential: the digest
        # must also equal the single producer job's recorded digest.
        uses: actions/download-artifact@v4
        with:
          name: bridge-wasm
          path: producer/
      - name: layout and identical WASM bytes
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          rm -rf verify-tmp
          mkdir verify-tmp
          test -f producer/muxe-zellij.sha256
          expected="$(cut -d' ' -f1 producer/muxe-zellij.sha256)"
          test -n "$expected"
          first_digest=""
          for archive in dist/muxe-v*.tar.gz; do
            name="$(basename "$archive" .tar.gz)"
            tar -xzf "$archive" -C verify-tmp
            test -x "verify-tmp/$name/muxe"
            test -f "verify-tmp/$name/lib/muxe/muxe-zellij.wasm"
            test -f "verify-tmp/$name/share/muxe/completions/muxe.bash"
            test -f "verify-tmp/$name/share/muxe/completions/_muxe"
            test -f "verify-tmp/$name/share/muxe/completions/muxe.fish"
            test -f "verify-tmp/$name/LICENSE"
            digest="$(file_digest "verify-tmp/$name/lib/muxe/muxe-zellij.wasm")"
            if [ -z "$first_digest" ]; then
              first_digest="$digest"
            elif [ "$digest" != "$first_digest" ]; then
              echo "release failure: WASM bytes differ in $name"
              exit 1
            fi
          done
          test "$first_digest" = "$expected" || {
            echo "release failure: archive WASM digest $first_digest"
            echo "does not match producer digest $expected"
            exit 1
          }
      - name: native compatibility reports equal WASM witness
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || {
            echo "MISSING: jq on this runner"
            exit 1
          }
          test -f producer/muxe-zellij.build-id
          bridge_build_id="$(cat producer/muxe-zellij.build-id)"
          test "${#bridge_build_id}" -eq 64
          test "$bridge_build_id" != "$(printf '%064d' 0)"
          expected_sha="$(cut -d' ' -f1 producer/muxe-zellij.sha256)"
          reports=(dist/native-compat-*.json)
          test "${#reports[@]}" -eq 3
          for report in "${reports[@]}"; do
            report_id="$(jq -r '.hosts.zellij.bridge_build_id' "$report")"
            test "$report_id" = "$bridge_build_id" || {
              echo "release failure: $report reports bridge ID $report_id, expected $bridge_build_id"
              exit 1
            }
            test "$(jq -r '.packaged_wasm.sha256' "$report")" = "$expected_sha"
            test "$(jq -r '.packaged_wasm.unavailable_reason' "$report")" = "null"
          done
      - name: runnable native smoke (linux-x64 on its own arch)
        # The native report carries the shared pre-link bridge identity and
        # the separately producer-attested packaged-WASM digest. These are
        # distinct: this step does not claim that the host API attested the
        # bytes loaded by Zellij.
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || {
            echo "MISSING: jq on this runner"
            exit 1
          }
          # Re-read the producer digest from the downloaded artifact in
          # this step: shell variables do not survive steps, and `set -u`
          # fails the gate on the previous step's `$first_digest`.
          # This validates the binary against independent producer bytes,
          # not a same-step variable.
          test -f producer/muxe-zellij.sha256
          expected="$(cut -d' ' -f1 producer/muxe-zellij.sha256)"
          test -n "$expected"
          version="$RELEASE_VERSION"
          bin="verify-tmp/muxe-v${version}-linux-x64/muxe"
          test -x "$bin"
          report="$("$bin" compatibility --json)"
          test "$(jq -r '.muxe_version' <<< "$report")" = "$version"
          test "$(jq -r '.packaged_wasm.sha256' <<< "$report")" = "$expected"
          test "$(jq -r '.packaged_wasm.unavailable_reason' <<< "$report")" = "null"
          bridge_build_id="$(jq -r '.hosts.zellij.bridge_build_id' <<< "$report")"
          test -f producer/muxe-zellij.build-id
          expected_bridge_build_id="$(cat producer/muxe-zellij.build-id)"
          test "$bridge_build_id" = "$expected_bridge_build_id"
          test "${#bridge_build_id}" -eq 64
          case "$bridge_build_id" in
            ""|null|*[!0-9a-f]*) echo "invalid bridge build ID: $bridge_build_id"; exit 1 ;;
          esac
          test "$bridge_build_id" != "$(printf '%064d' 0)"
      - name: attest archives (before any publication)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/muxe-v*.tar.gz, SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: |
            SHA256SUMS
            WASM_SHA256

  hosts:
    name: prepare host tools (${{ matrix.asset }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - asset: linux-x64
            os: ubuntu-24.04
            herdr_asset: herdr-linux-x86_64
            herdr_digest: 976150a14d490c94b243ea2e1a7eb2dfb67f12e36b182db90936f6728e6aecf4
          - asset: linux-arm64
            os: ubuntu-24.04-arm
            herdr_asset: herdr-linux-aarch64
            herdr_digest: f55610658e1c2e0d2aaef730b4b2ab885f7f8ba00285ab372bfb14f2e3d5b40d
          - asset: macos-arm64
            os: macos-15
            herdr_asset: herdr-macos-aarch64
            herdr_digest: a5d4f4d504d8b309c91f811050559300faba31258425f53c50852fc96f6ae574
    runs-on: ${{ matrix.os }}
    env:
      ALLOW_LIVE_HOST_MATRIX: ${{ vars.ALLOW_LIVE_HOST_MATRIX }}
    steps:
      - uses: actions/checkout@v4
      - name: live-host approval opt-in (before costly installs)
        run: |
          set -euo pipefail
          test "${ALLOW_LIVE_HOST_MATRIX:-}" = "true" || {
            echo "BLOCKED: current target-only live-host smoke requires recorded user approval." >&2
            echo "Set the ALLOW_LIVE_HOST_MATRIX repository variable to \"true\" only after approval." >&2
            exit 1
          }
      - uses: jdx/mise-action@v2
        with:
          install: true
      - uses: jdx/mr-boxington-action@v1
        with:
          # Default target pruning excludes the external Zellij package.
          github-cache-mode: objects
      - name: pinned toolchain assert (single source is mise.toml)
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          test -n "$pin"
          mise exec -- cargo --version | grep -F "cargo $pin"
      - name: pinned Zellij host (source build at pin)
        run: |
          set -euo pipefail
          zrepo="$(sed -n 's/^repository = "\(.*\)"$/\1/p' pins/zellij.toml)"
          zrev="$(sed -n 's/^revision = "\(.*\)"$/\1/p' pins/zellij.toml)"
          zver="$(sed -n 's/^host_version = "\(.*\)"$/\1/p' pins/zellij.toml)"
          test -n "$zrepo"
          test -n "$zrev"
          test -n "$zver"
          zdir="$RUNNER_TEMP/zellij-host"
          mkdir -p "$zdir"
          CARGO_TARGET_DIR=target/zellij-install \
            mise exec -- mbx install --git "$zrepo" --rev "$zrev" \
              --locked --root "$zdir" zellij
          "$zdir/bin/zellij" --version | grep -F "$zver"
          echo "ZELLIJ_BINARY=$zdir/bin/zellij" >> "$GITHUB_ENV"
      - name: pinned Herdr host (0.8.2, digest-verified)
        run: |
          set -euo pipefail
          file_digest() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1;
            elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1;
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          hasset="${{ matrix.herdr_asset }}"
          hdigest="${{ matrix.herdr_digest }}"
          test -n "$hasset"
          test "${#hdigest}" -eq 64
          hdir="$RUNNER_TEMP/herdr-host"
          mkdir -p "$hdir"
          curl -fSL "https://github.com/herdrdev/herdr/releases/download/v0.8.2/$hasset" -o "$hdir/herdr"
          test "$(file_digest "$hdir/herdr")" = "$hdigest" || {
            echo "Herdr release asset digest mismatch for $hasset"
            exit 1
          }
          chmod 755 "$hdir/herdr"
          if [ "$(uname)" = "Darwin" ] \
            && xattr -p com.apple.quarantine "$hdir/herdr" >/dev/null 2>&1; then
            xattr -d com.apple.quarantine "$hdir/herdr" || {
              echo "release failure: cannot clear macOS quarantine on $hdir/herdr"
              exit 1
            }
          fi
          "$hdir/herdr" --version | grep -F "0.8.2"
          echo "HERDR_BINARY=$hdir/herdr" >> "$GITHUB_ENV"
      - name: package host tools
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-hosts"
          rm -rf "$root"
          mkdir -p "$root/bin"
          cp "$ZELLIJ_BINARY" "$root/bin/zellij"
          cp "$HERDR_BINARY" "$root/bin/herdr"
          chmod 755 "$root/bin/zellij" "$root/bin/herdr"
          archive="release-hosts-${{ matrix.asset }}.tar.gz"
          tar -czf "$archive" -C "$root" .
          echo "HOST_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: release-hosts-${{ matrix.asset }}
          path: ${{ env.HOST_ARCHIVE }}
  target-smoke:
    name: current target-only host smoke (${{ matrix.asset }})
    needs: [assets, hosts, metadata]
    strategy:
      fail-fast: true
      matrix:
        include:
          - asset: linux-x64
            os: ubuntu-24.04
          - asset: linux-arm64
            os: ubuntu-24.04-arm
          - asset: macos-arm64
            os: macos-15
    env:
      ALLOW_LIVE_HOST_MATRIX: ${{ vars.ALLOW_LIVE_HOST_MATRIX }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: live-host approval opt-in (before costly installs)
        # This explicit repository-variable guard authorizes only the current
        # target-only owned-host smoke. Cross-release execution remains
        # deferred in TODO-CROSS-RELEASE.md until a real predecessor exists.
        run: |
          set -euo pipefail
          test "${ALLOW_LIVE_HOST_MATRIX:-}" = "true" || {
            echo "BLOCKED: current target-only live-host smoke requires recorded user approval." >&2
            echo "Set the ALLOW_LIVE_HOST_MATRIX repository variable to \"true\" only after approval." >&2
            exit 1
          }
      - uses: jdx/mise-action@v2
        with:
          install: true
      - uses: jdx/mr-boxington-action@v1
      - name: pinned toolchain assert (single source is mise.toml)
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          test -n "$pin"
          mise exec -- cargo --version | grep -F "cargo $pin"
      - name: prepared host tools
        uses: actions/download-artifact@v4
        with:
          name: release-hosts-${{ matrix.asset }}
          path: host-stage
      - name: stage prepared host tools
        run: |
          set -euo pipefail
          archive="host-stage/release-hosts-${{ matrix.asset }}.tar.gz"
          test -f "$archive" || { echo "MISSING: prepared host archive $archive"; exit 1; }
          root="$RUNNER_TEMP/release-hosts"
          rm -rf "$root"
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"
          test -x "$root/bin/zellij" || { echo "MISSING: prepared Zellij"; exit 1; }
          test -x "$root/bin/herdr" || { echo "MISSING: prepared Herdr"; exit 1; }
          {
            echo "MUXE_ZELLIJ_BINARY=$root/bin/zellij"
            echo "MUXE_HERDR_BINARY=$root/bin/herdr"
          } >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: target archive for the current smoke
        uses: actions/download-artifact@v4
        with:
          name: muxe-v${{ needs.metadata.outputs.version }}-${{ matrix.asset }}.tar.gz
          path: target-dist
      - name: stage current target installation
        # Stage the complete archive produced by this tagged workflow. No
        # predecessor lookup or synthetic old artifact is used here.
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          archive="target-dist/muxe-v${version}-${{ matrix.asset }}.tar.gz"
          test -f "$archive" || {
            echo "MISSING: current target archive $archive"
            exit 1
          }
          rm -rf "$RUNNER_TEMP/target-install"
          mkdir -p "$RUNNER_TEMP/target-install"
          tar -xzf "$archive" -C "$RUNNER_TEMP/target-install"
          root="$RUNNER_TEMP/target-install/muxe-v${version}-${{ matrix.asset }}"
          test -x "$root/muxe" || { echo "MISSING: target executable"; exit 1; }
          test -f "$root/lib/muxe/muxe-zellij.wasm" || {
            echo "MISSING: target bridge WASM"
            exit 1
          }
          test ! -e "$root/bin/muxe" || {
            echo "INVALID: target archive uses a bin-nested executable"
            exit 1
          }
          test "$("$root/muxe" --version | cut -d' ' -f2)" = "$version" || {
            echo "target binary version mismatch"
            exit 1
          }
          echo "MUXE_TARGET_INSTALLATION=$root" >> "$GITHUB_ENV"
      - name: runner fixture binaries
        run: |
          set -euo pipefail
          mise exec -- cargo build --locked --manifest-path tools/muxe-zellij-foreground/Cargo.toml --bins
          fx="$PWD/tools/muxe-zellij-foreground/target/debug"
          test -x "$fx/muxe-zellij-foreground" || { echo "MISSING: built foreground binary"; exit 1; }
          test -x "$fx/muxe-zellij-bootstrap" || { echo "MISSING: built bootstrap binary"; exit 1; }
          test -x "$fx/muxe-zellij-permit" || { echo "MISSING: built permission seeder"; exit 1; }
          test -x "$fx/muxe-zellij-fault-injector" || { echo "MISSING: built fault-injector binary"; exit 1; }
          {
            echo "MUXE_ZELLIJ_FOREGROUND_BINARY=$fx/muxe-zellij-foreground"
            echo "MUXE_ZELLIJ_BOOTSTRAP_BINARY=$fx/muxe-zellij-bootstrap"
            echo "MUXE_ZELLIJ_PERMISSION_SEEDER=$fx/muxe-zellij-permit"
          } >> "$GITHUB_ENV"
      - name: current target-only both-host smoke
        # The release archive is the only installation under test. Every typed
        # input and the explicit live-host approval is required; missing
        # capability never becomes a green skip.
        run: |
          set -euo pipefail
          MUXE_TARGET_INSTALLATION="$MUXE_TARGET_INSTALLATION" \
          MUXE_HERDR_BINARY="$MUXE_HERDR_BINARY" \
          MUXE_ZELLIJ_BINARY="$MUXE_ZELLIJ_BINARY" \
          MUXE_ZELLIJ_FOREGROUND_BINARY="$MUXE_ZELLIJ_FOREGROUND_BINARY" \
          MUXE_ZELLIJ_BOOTSTRAP_BINARY="$MUXE_ZELLIJ_BOOTSTRAP_BINARY" \
          MUXE_ZELLIJ_PERMISSION_SEEDER="$MUXE_ZELLIJ_PERMISSION_SEEDER" \
          MUXE_LIVE_HOSTS_APPROVED=true \
          mise exec -- cargo test --locked -p muxe --test live_hosts -- --ignored --exact target_only_smoke
  publish:
    needs: [verify, target-smoke, shared-checks, metadata]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && needs.verify.result == 'success' && needs.target-smoke.result == 'success' && needs.shared-checks.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: pre-publish checksum gate (fail on anything missing)
        run: |
          set -euo pipefail
          manifest_check() {
            if command -v sha256sum >/dev/null 2>&1; then (cd "$2" && sha256sum -c "$1");
            elif command -v shasum >/dev/null 2>&1; then (cd "$2" && shasum -a 256 -c "$1");
            else echo "MISSING: no sha256sum or shasum on this runner"; return 1; fi
          }
          archives=(dist/muxe-v*.tar.gz)
          test "${#archives[@]}" -eq 3
          test -f dist/SHA256SUMS
          manifest_check SHA256SUMS dist
      - name: create release (archives plus checksums, attestations already made)
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/muxe-v*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
