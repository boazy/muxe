# Presentation uses semantic colors only; pair with any color scheme.
common:
  styles:
    default:
      foreground: base.text
      background: base.background
    muted:
      foreground: base.muted
      background: base.background
menu:
  styles:
    title:
      foreground: base.text
      background: base.background
      bold: true
    hotkey:
      foreground: base.background
      background: menu.hotkey
      bold: true
    arrow:
      foreground: menu.separator
      background: base.background
    badge_edge:
      foreground: menu.hotkey
      background: base.background
    disabled_badge:
      foreground: base.background
      background: base.muted
    disabled_badge_edge:
      foreground: base.muted
      background: base.background
    disabled:
      foreground: base.muted
      background: base.background
    crumb:
      foreground: base.muted
      background: base.background
    error:
      foreground: status.error
      background: base.background
      bold: true
    pending:
      foreground: status.pending
      background: base.background
      bold: true
    blocked:
      foreground: status.blocked
      background: base.background
      bold: true
    reload:
      foreground: status.reload
      background: base.background
    notice:
      foreground: status.notice
      background: base.background
  templates:
    cell: >-
      {% if blocked %}[blocked]! [/blocked]{% elif disabled %}[disabled]- [/disabled]{% else %}  {% endif %}{% if disabled %}[disabled_badge] {{ key | rpad(key_width) }} [/disabled_badge][disabled_badge_edge][/disabled_badge_edge][disabled] {{ title }}[/disabled]{% else %}[hotkey] {{ key | rpad(key_width) }} [/hotkey][badge_edge][/badge_edge][default] {{ title }}[/default]{% endif %}
    breadcrumbs: >-
      {% for c in crumbs %}{% if loop.last %}[title]{{ c }}[/title]{% else %}[crumb]{{ c }}[/crumb][arrow] › [/arrow]{% endif %}{% endfor %}
    pagination.full: >-
      {% if prev_key %}[arrow]‹ [/arrow][hotkey] {{ prev_key }} [/hotkey][muted]  [/muted]{% endif %}[title]{{ pages.current }}/{{ pages.count }}[/title]{% if next_key %}[muted]  [/muted][hotkey] {{ next_key }} [/hotkey][arrow] ›[/arrow]{% endif %}
    pagination.short: >-
      [title]{{ pages.current }}/{{ pages.count }}[/title]
    status: >-
      {% if level == 'error' %}[error]Error: {{ message }}[/error]{% elif level == 'pending' %}[pending]Pending: {{ message }}[/pending]{% elif level == 'blocked' %}[blocked]Blocked: {{ message }}[/blocked]{% elif level == 'reload' %}[reload]Reload: {{ message }}[/reload]{% else %}[notice]Notice: {{ message }}[/notice]{% endif %}
