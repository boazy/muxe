[package]
name = "muxe-zellij-foreground"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "muxe-zellij-foreground"
path = "src/main.rs"
[[bin]]
name = "muxe-zellij-bootstrap"
path = "src/bootstrap.rs"

[[bin]]
name = "muxe-zellij-permit"
path = "src/permit.rs"

[[bin]]
name = "muxe-zellij-fault-injector"
path = "src/fault_injector.rs"

[dependencies]
zellij-server = { git = "https://github.com/zellij-org/zellij.git", rev = "81f56e1aed4e17b822af5cb382a8f524e35f3eae" }
zellij-utils = { git = "https://github.com/zellij-org/zellij.git", rev = "81f56e1aed4e17b822af5cb382a8f524e35f3eae" }

[dev-dependencies]
interprocess = { version = "2", default-features = false }
tempfile = { version = "3", default-features = false }
