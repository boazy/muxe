[tools]
rust = { version = "1.97.1", targets = ["wasm32-wasip1"], components = ["rustfmt", "clippy"] }
"cargo:cargo-codspeed" = "5.0.1"

[tasks.fmt]
description = "Check Rust formatting on the pinned toolchain"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "Compile registered crates with the pinned lockfile"
run = "cargo check --workspace --locked"

[tasks.test]
description = "Run registered workspace tests and doctests"
run = "cargo test --workspace --locked"

[tasks.clippy]
description = "Run strict Clippy checks"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -W clippy::pedantic -W clippy::allow_attributes -W clippy::allow_attributes_without_reason -W clippy::redundant_clone -W clippy::unused_peekable"

[tasks.codegen-herdr]
description = "Verify Herdr-generated sources are byte-clean"
run = "cargo run --locked -p muxe-herdr-gen -- --check"

[tasks.codegen-zellij]
description = "Verify Zellij-generated sources are byte-clean"
run = "cargo run --locked -p muxe-zellij-gen -- --check"

[tasks.codegen-zellij-materialize]
description = "Materialize minimized Zellij fixtures from the pinned source"
run = "cargo run --locked -p muxe-zellij-gen -- --materialize-fixtures"

[tasks.codegen-zellij-verify]
description = "Verify Zellij fixtures from a fresh pinned source materialization"
run = "cargo run --locked -p muxe-zellij-gen -- --verify-fixtures"

[tasks.completions]
description = "Generate committed shell completions from the clap definition"
run = "cargo run --locked -p codegen-completions"

[tasks.wasm-build]
description = "Build the pinned Zellij bridge WASM (release) and stage dist-wasm/muxe-zellij.wasm"
run = "cargo build --locked --release -p muxe-zellij-wasm --target wasm32-wasip1 && mkdir -p dist-wasm && cp target/wasm32-wasip1/release/muxe-zellij-wasm.wasm dist-wasm/muxe-zellij.wasm"

[tasks.wasm-build-previous]
description = "Build a distinct same-source debug WASM artifact for rollback ownership smoke"
run = "cargo build --locked -p muxe-zellij-wasm --target wasm32-wasip1"

[tasks.verify-packaged-wasm]
depends = ["wasm-build"]
description = "Verify the native packaged-WASM digest against the real producer bytes"
run = '''
set -euo pipefail
file_digest() {
  if command -v sha256sum >/dev/null 2>&1; then
    sha256sum "$1" | cut -d' ' -f1
  elif command -v shasum >/dev/null 2>&1; then
    shasum -a 256 "$1" | cut -d' ' -f1
  else
    echo "MISSING: no sha256sum or shasum" >&2
    return 1
  fi
}
export MUXE_WASM_SHA256="$(file_digest dist-wasm/muxe-zellij.wasm)"
cargo test --locked -p muxe --lib -- --ignored --exact \
  compatibility::tests::packaged_wasm_matches_producer_bytes_and_rejects_tampering
'''
[tasks.verify-activation-preflight]
depends = ["wasm-build", "wasm-build-previous"]
description = "Run activation receipt/preflight transaction tests with the pinned producer WASM"
run = '''
set -euo pipefail
file_digest() {
  if command -v sha256sum >/dev/null 2>&1; then
    sha256sum "$1" | cut -d' ' -f1
  elif command -v shasum >/dev/null 2>&1; then
    shasum -a 256 "$1" | cut -d' ' -f1
  else
    echo "MISSING: no sha256sum or shasum" >&2
    return 1
  fi
}
export MUXE_WASM_SHA256="$(file_digest dist-wasm/muxe-zellij.wasm)"
export MUXE_TEST_PACKAGED_WASM="$PWD/dist-wasm/muxe-zellij.wasm"
export MUXE_TEST_PREVIOUS_WASM="$PWD/target/wasm32-wasip1/debug/muxe-zellij-wasm.wasm"
for test_name in \
  lifecycle::activate::tests::zellij_fast_path_requires_verified_stable_bridge_bytes \
  lifecycle::activate::tests::zellij_stale_receipt_owned_bridge_transacts_despite_target_record \
  lifecycle::activate::tests::zellij_missing_or_unrecognized_bridge_never_reports_unchanged \
  lifecycle::activate::tests::zellij_symlink_with_matching_receipt_fails_closed \
  lifecycle::activate::tests::zellij_receipt_path_and_mode_fail_closed
do
  cargo test --locked -p muxe --lib -- --ignored --exact "$test_name"
done
'''

[tasks.bench-codspeed]
description = "Build CodSpeed comparisons with the pinned runner"
run = "cargo codspeed build --locked"
