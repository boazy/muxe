[tools]
rust = "1.97.1"

[tasks.fmt]
description = "Check Rust formatting on the pinned toolchain"
run = "env -u RUSTUP_TOOLCHAIN cargo fmt --all -- --check"

[tasks.check]
description = "Compile registered crates with the pinned lockfile"
run = "env -u RUSTUP_TOOLCHAIN cargo check --workspace --locked"

[tasks.test]
description = "Run registered workspace tests and doctests"
run = "env -u RUSTUP_TOOLCHAIN cargo test --workspace --locked"

[tasks.clippy]
description = "Run strict Clippy checks"
run = "env -u RUSTUP_TOOLCHAIN cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -W clippy::pedantic -W clippy::allow_attributes -W clippy::allow_attributes_without_reason"

[tasks.codegen-herdr]
description = "Verify Herdr-generated sources are byte-clean"
run = "env -u RUSTUP_TOOLCHAIN cargo run --locked -p muxe-herdr-gen -- --check"

[tasks.codegen-zellij]
description = "Verify Zellij-generated sources are byte-clean"
run = "env -u RUSTUP_TOOLCHAIN cargo run --locked -p muxe-zellij-gen -- --check"

[tasks.codegen-zellij-materialize]
description = "Materialize minimized Zellij fixtures from the pinned source"
run = "env -u RUSTUP_TOOLCHAIN cargo run --locked -p muxe-zellij-gen -- --materialize-fixtures"

[tasks.codegen-zellij-verify]
description = "Verify Zellij fixtures from a fresh pinned source materialization"
run = "env -u RUSTUP_TOOLCHAIN cargo run --locked -p muxe-zellij-gen -- --verify-fixtures"

[tasks.completions]
description = "Generate committed shell completions from the clap definition"
run = "env -u RUSTUP_TOOLCHAIN cargo run --locked -p codegen-completions"

[tasks.wasm-build]
description = "Build the pinned Zellij bridge WASM and stage dist-wasm/muxe-zellij.wasm"
run = "env -u RUSTUP_TOOLCHAIN cargo build --locked -p muxe-zellij-wasm --target wasm32-wasip1 && mkdir -p dist-wasm && cp target/wasm32-wasip1/debug/muxe_zellij_wasm.wasm dist-wasm/muxe-zellij.wasm"
