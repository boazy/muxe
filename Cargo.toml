[workspace]
resolver = "2"
# Runtime members are added only when their source owners have real crate roots.
members = ["crates/muxe-core", "crates/muxe-terminal-input", "tools/muxe-herdr-gen"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "1.2.0"
saphyr = "0.0.6"
serde_json = "1.0.145"
rkyv = { version = "0.8.10", default-features = false, features = ["std", "alloc", "bytecheck", "little_endian", "aligned", "pointer_width_32"] }
bytecheck = "0.8.2"
thiserror = "2.0.17"
ariadne = "0.5.1"
eyre = "0.6.12"
color-eyre = "0.6.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
itertools = "0.14.0"
platform-dirs = "0.3.0"
crossterm = "0.29.0"
minijinja = "2.12.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
unicode-width = "0.2.1"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time", "process", "net"] }
tokio-util = { version = "0.7.17", features = ["codec"] }
nix = { version = "0.30.1", features = ["signal", "process"] }
notify = "8.2.0"
regex = "1.12.2"
clap = { version = "4.5.51", features = ["derive"] }
kdl = { version = "6.5.0", features = ["v1"] }
cel = "0.14.4"
rand = "0.9.2"
data-encoding = "2.9.0"
sha2 = "0.10.9"
async-trait = "0.1.89"
zellij-tile = { git = "https://github.com/zellij-org/zellij.git", rev = "af38660c5884f50bb3726682fb92961326c4268f", package = "zellij-tile" }
syn = "2.0.108"
quote = "1.0.41"
proc-macro2 = "1.0.103"
prettyplease = "0.2.37"
schemars = "0.8.22"
typify = "0.5.0"
insta = "1.46.1"
proptest = "1.9.0"
rstest = "0.26.1"
tempfile = "3.23.0"
trycmd = "0.15.10"
assert_cmd = "2.0.17"
snapbox = "0.6.23"
divan = "0.1.21"
testty = "0.2.1"
